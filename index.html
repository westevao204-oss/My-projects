    /* ---------------------------------------------------------------------
       2. STORE — progress, xp, streak (persisted to localStorage)
    --------------------------------------------------------------------- */
    const STORE_KEY = "foundry_progress_v1";
    function loadStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          parsed.quizClaimed = parsed.quizClaimed || {};
          return parsed;
        }
      } catch (e) { console.warn("Could not read saved progress", e); }
      return {
        xp: 0, streak: 0, lastActive: null,
        completedLessons: [], completedProjects: [], quizScores: {}, quizClaimed: {}, perfectQuizzes: 0,
        unlockedAchievements: [], notes: {}, theme: "dark"
      };
    }
    let state = loadStore();
    function saveStore() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { console.warn("Could not save progress", e); }
    }
    function touchStreak() {
      const today = new Date().toDateString();
      if (state.lastActive === today) return;
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const yesterday = d.toDateString();
      state.streak = (state.lastActive === yesterday) ? state.streak + 1 : 1;
      state.lastActive = today;
      saveStore();
    }
    touchStreak();

    function addXP(amount, reason) {
      state.xp += amount;
      saveStore();
      showToast(`+${amount} XP — ${reason}`);
      checkAchievements();
    }
    function completeLesson(id) {
      if (state.completedLessons.includes(id)) return;
      state.completedLessons.push(id);
      saveStore();
      addXP(15, "lesson complete");
    }
    function completeProject(id) {
      if (state.completedProjects.includes(id)) return;
      state.completedProjects.push(id);
      saveStore();
      addXP(60, "project complete");
    }
    function recordQuiz(lessonId, correct, total) {
      state.quizScores[lessonId] = { correct, total };
      if (correct === total) state.perfectQuizzes++;
      if (!state.quizClaimed) state.quizClaimed = {};
      if (!state.quizClaimed[lessonId] && correct >= Math.ceil(total * 0.6)) {
        state.quizClaimed[lessonId] = true;
        addXP(5 * correct, "quiz passed");
      }
      saveStore();
    }
    function checkAchievements() {
      ACHIEVEMENTS.forEach(a => {
        if (!state.unlockedAchievements.includes(a.id) && a.check(state)) {
          state.unlockedAchievements.push(a.id);
          saveStore();
          setTimeout(() => showToast(`🏆 Achievement unlocked: ${a.name}`), 500);
        }
      });
    }
    checkAchievements();

    function levelProgress(levelId) {
      const lvl = LEVELS.find(l => l.id === levelId);
      if (!lvl) return 0;
      const totalLessons = lvl.lessons.length;
      const totalProjects = lvl.projectIds.length;
      const doneLessons = lvl.lessons.filter(l => state.completedLessons.includes(l.id)).length;
      const doneProjects = lvl.projectIds.filter(id => state.completedProjects.includes(id)).length;
      const total = totalLessons + totalProjects;
      const done = doneLessons + doneProjects;
      return total === 0 ? 0 : Math.round((done / total) * 100);
    }
    function xpForLevel(xp) { return Math.floor(xp / 150) + 1; }

    /* ---------------------------------------------------------------------
       3. ROUTER + RENDER
    --------------------------------------------------------------------- */
    function showToast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove("show"), 2600);
    }

    function navigate(hash) { location.hash = hash; }
    window.addEventListener("hashchange", render);
    window.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      render();
      // Global click listener attached once to prevent memory leaks
      document.addEventListener("click", (e) => {
        const results = document.getElementById("searchResults");
        if (results && !e.target.closest(".search-wrap")) {
          results.innerHTML = "";
          results.classList.remove("search-results");
        }
        const sidebar = document.getElementById("sidebar");
        const hamBtn = document.getElementById("hamBtn");
        if (sidebar && sidebar.classList.contains("open") && !sidebar.contains(e.target) && e.target !== hamBtn && !hamBtn.contains(e.target)) {
          sidebar.classList.remove("open");
        }
      });
    });

    function setMode(mode) {
      state.theme = mode;
      saveStore();
      applyTheme();
      showToast(mode === 'dark' ? "🌙 Switched to Dark Mode" : "☀️ Switched to Light Mode");
    }

    function toggleTheme() {
      const next = state.theme === 'dark' ? 'light' : 'dark';
      setMode(next);
    }

    function applyTheme() {
      if (state.theme === "light") document.documentElement.setAttribute("data-theme", "light");
      else document.documentElement.setAttribute("data-theme", "dark");

    function esc(s) {
      if (!s) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    function findLesson(id) {
      for (const lvl of LEVELS) { const f = lvl.lessons.find(l => l.id === id); if (f) return { lesson: f, level: lvl }; }

    function wireShell() {
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebarBackdrop");
      const closeBtn = document.getElementById("sidebarCloseBtn");

      function closeDrawer() {
        if (sidebar) sidebar.classList.remove("open");
        if (backdrop) backdrop.classList.remove("active");
        document.body.style.overflow = "";
      }

      function openDrawer() {
        if (sidebar) sidebar.classList.add("open");
        if (backdrop) backdrop.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      document.querySelectorAll("#sidebar [data-nav], .brand[data-nav]").forEach(b => {
        b._wired = true;
        b.addEventListener("click", () => {
          navigate(b.getAttribute("data-nav"));
          closeDrawer();
        });
      });

      const hamBtn = document.getElementById("hamBtn");
      if (hamBtn) {
        hamBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (sidebar && sidebar.classList.contains("open")) {
            closeDrawer();
          } else {
            openDrawer();
          }
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          closeDrawer();
        });
      }

      if (backdrop) {
        backdrop.addEventListener("click", closeDrawer);
      }

      document.querySelectorAll(".mode-btn").forEach(b => {
        b.addEventListener("click", () => {
          setMode(b.getAttribute("data-mode"));
        });
      });

      const input = document.getElementById("searchInput");
      const results = document.getElementById("searchResults");
      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) { results.innerHTML = ""; results.classList.remove("search-results"); return; }
        const hits = [];
        LEVELS.forEach(lvl => lvl.lessons.forEach(l => {
          if (l.title.toLowerCase().includes(q) || l.simple.toLowerCase().includes(q)) hits.push({ kind: "Lesson", title: l.title, hash: `#/learn/${l.id}` });
        }));
        PROJECTS.forEach(p => { if (p.title.toLowerCase().includes(q)) hits.push({ kind: "Project", title: p.title, hash: `#/projects/${p.id}` }); });
        GLOSSARY.forEach(g => { if (g.term.toLowerCase().includes(q) || g.simple.toLowerCase().includes(q)) hits.push({ kind: "Glossary", title: g.term, hash: `#/glossary` }); });
        if (hits.length === 0) { results.innerHTML = `<div class="sr-item"><div class="sr-title">No results</div></div>`; }
        else results.innerHTML = hits.slice(0, 8).map(h => `<div class="sr-item" data-h="${h.hash}"><div class="sr-kind">${h.kind}</div><div class="sr-title">${esc(h.title)}</div></div>`).join("");
        results.classList.add("search-results");
        results.querySelectorAll(".sr-item[data-h]").forEach(el => el.addEventListener("click", () => {
          navigate(el.getAttribute("data-h"));
          input.value = "";
          results.innerHTML = "";
          closeDrawer();
        }));
      });
    }

      </div>
    </div>`).join("") + `<div id="quizScoreLine"></div>`;
    }

    function wireLesson(id) {
      const found = findLesson(id);
      if (!found) return;
      const { lesson } = found;
      let scoreCorrect = 0, answered = 0;

      document.querySelectorAll(".quiz-q").forEach(qEl => {
        const qi = +qEl.getAttribute("data-qi");
        const q = lesson.quiz[qi];
        qEl.querySelectorAll(".quiz-opt").forEach(btn => {
          btn.addEventListener("click", () => {
            if (qEl.querySelector(".quiz-opt.correct, .quiz-opt.wrong")) return; // already answered
            const oi = +btn.getAttribute("data-oi");
            answered++;
            if (oi === q.a) { btn.classList.add("correct"); scoreCorrect++; }
            else { btn.classList.add("wrong"); qEl.querySelectorAll(".quiz-opt")[q.a].classList.add("correct"); }
            qEl.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
            if (answered === lesson.quiz.length) {
              recordQuiz(id, scoreCorrect, lesson.quiz.length);
              document.getElementById("quizScoreLine").innerHTML = `<p style="font-weight:700; color:${scoreCorrect === lesson.quiz.length ? 'var(--accent-green)' : 'var(--fg)'}; margin-top:8px;">Score: ${scoreCorrect}/${lesson.quiz.length} ${scoreCorrect === lesson.quiz.length ? '— perfect! 🎯' : ''}</p>`;
            }
          });
        });
      });

      const markBtn = document.getElementById("markDoneBtn");
      if (markBtn) markBtn.addEventListener("click", () => {
        completeLesson(id);
        render();
      });

      if (lesson.playground) wirePlayground("lesson-" + id, lesson.playground);
      wireGenericButtons();
    }

      const defaultTab = (isNode || isRN) ? "js" : "html";

      return `
  <div class="editor-wrap ${isNode ? 'editor-node' : (isRN ? 'editor-rn' : '')}" id="pg-${key}" data-mode="${mode}">

      <button class="etab ${defaultTab === 'css' ? 'active' : ''}" data-tab="css">${tab2Label}</button>

      <div class="editor-pane">

    function wireGenericButtons() {
      document.querySelectorAll("[data-nav]").forEach(el => {
        if (el._wired) return;
        el._wired = true;
        el.addEventListener("click", (e) => {
