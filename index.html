<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Foundry. — Learn to Build the Web</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ============ DESIGN TOKENS & THEMING ============ */
    :root {
      /* Brand Accents */
      --primary: #F59E0B;
      --primary-hover: #D97706;
      --primary-glow: rgba(245, 158, 11, 0.4);
      --primary-grad: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
      --primary-grad-glow: 0 10px 25px -4px rgba(234, 88, 12, 0.45);

      --accent-purple: #8B5CF6;
      --accent-cyan: #06B6D4;
      --accent-rose: #F43F5E;
      --accent-green: #10B981;
      --accent-blue: #3B82F6;

      /* Fonts */
      --head: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'IBM Plex Mono', Consolas, monospace;

      /* Radii */
      --radius: 18px;
      --radius-sm: 10px;
      --radius-pill: 9999px;

      /* Default Dark Mode (Inspired by E-Online & Class) */
      --bg: #0B0F17;
      --surface: #121826;
      --surfacgve-hover: #172033;
      --surface-dim: #182234;
      --surface-glass: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-focus: rgba(245, 158, 11, 0.5);

      --fg: #F8FAFC;
      --fg-dim: #94A3B8;
      --fg-faint: #64748B;
      --code-bg: #070B11;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 25px rgba(245, 158, 11, 0.25);
    }

    :root[data-theme="light"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-hover: #F1F5F9;
      --surface-dim: #F1F5F9;
      --surface-glass: rgba(255, 255, 255, 0.9);
      --border: #E2E8F0;
      --border-subtle: #F1F5F9;
      --border-focus: rgba(245, 158, 11, 0.5);

      --fg: #0F172A;
      --fg-dim: #475569;
      --fg-faint: #94A3B8;
      --code-bg: #0F172A;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 12px 30px -10px rgba(0, 0, 0, 0.1);
      --shadow-glow: 0 0 25px rgba(245, 158, 11, 0.15);
    }

    /* ============ DARK MODE — COLOUR DAMPING ============ */
    /* Muted accent palette — still identifiable but not neon-vivid */
    :root[data-theme="dark"] {
      --accent-purple: #7C6FA0;
      /* was #8B5CF6 */
      --accent-cyan: #3A8FA3;
      /* was #06B6D4 */
      --accent-rose: #A0445A;
      /* was #F43F5E */
      --accent-green: #3A8C6E;
      /* was #10B981 */
      --accent-blue: #4A72A8;
      /* was #3B82F6 */

      /* Primary amber — slightly cooled */
      --primary: #D4880A;
      --primary-hover: #B8730A;
      --primary-glow: rgba(212, 136, 10, 0.25);
      --primary-grad: linear-gradient(135deg, #C47F0A 0%, #9A4A08 100%);
      --primary-grad-glow: 0 10px 25px -4px rgba(156, 74, 8, 0.3);

      /* Softer glow in body bg */
      --shadow-glow: 0 0 20px rgba(212, 136, 10, 0.12);
    }

    /* Squircle cards — deep, desaturated tones instead of vivid gradients */
    :root[data-theme="dark"] .squircle-card.c-magenta {
      background: linear-gradient(145deg, #6B2A3A 0%, #3D1420 100%);
      box-shadow: 0 8px 20px -4px rgba(80, 20, 35, 0.5);
    }

    :root[data-theme="dark"] .squircle-card.c-orange {
      background: linear-gradient(145deg, #7A4E0A 0%, #4A2E06 100%);
      box-shadow: 0 8px 20px -4px rgba(80, 50, 5, 0.5);
    }

    :root[data-theme="dark"] .squircle-card.c-cyan {
      background: linear-gradient(145deg, #1A5568 0%, #0D3040 100%);
      box-shadow: 0 8px 20px -4px rgba(10, 40, 55, 0.5);
    }

    :root[data-theme="dark"] .squircle-card.c-purple {
      background: linear-gradient(145deg, #3D2A6B 0%, #22163D 100%);
      box-shadow: 0 8px 20px -4px rgba(30, 15, 55, 0.5);
    }

    /* Hero glow — much softer in dark mode */
    :root[data-theme="dark"] .hero-glow {
      background: radial-gradient(circle, rgba(180, 100, 10, 0.10) 0%, transparent 70%);
    }

    /* Gradient text — warm but not electric */
    :root[data-theme="dark"] .gradient-text {
      background: linear-gradient(135deg, #C47F0A 0%, #8A3808 50%, #7A2A48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Browse-all circle — toned primary */
    :root[data-theme="dark"] .browse-circle {
      background: var(--primary-grad);
    }

    /* Body background noise — suppress bright glow blobs in dark mode */
    :root[data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 85% 10%, rgba(180, 100, 8, 0.03) 0%, transparent 45%),
        radial-gradient(circle at 10% 85%, rgba(80, 50, 120, 0.02) 0%, transparent 45%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 85% 10%, rgba(245, 158, 11, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 10% 85%, rgba(139, 92, 246, 0.05) 0%, transparent 45%);
      color: var(--fg);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--head);
      color: var(--fg);
      margin: 0 0 .4em;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      line-height: 1.65;
      color: var(--fg-dim);
      margin: 0 0 1em;
      font-size: 14.5px;
    }

    code,
    pre,
    .mono {
      font-family: var(--mono);
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      font-family: var(--head);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    ::selection {
      background: rgba(245, 158, 11, 0.3);
      color: #FFF;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Subtle blueprint texture */
    .grid-tex {
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    /* ============ APP SHELL ============ */
    #app {
      display: flex;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      position: relative;
    }

    /* Mobile Backdrop for Sidebar */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .sidebar-backdrop.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 30;
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header .brand {
      border-bottom: none;
      flex: 1;
    }

    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--fg-dim);
      font-size: 20px;
      padding: 10px 16px;
      cursor: pointer;
      line-height: 1;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .sidebar-close-btn:hover {
      color: var(--fg);
      background: var(--surface-dim);
    }

    .brand {
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.45));
      transition: transform 0.22s ease;
    }

    .brand:hover .brand-logo-img {
      transform: scale(1.05);
    }

    .brand-name {
      font-family: var(--head);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.03em;
      color: var(--fg);
    }

    .brand-name span {
      color: var(--primary);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--fg-faint);
      margin-top: -1px;
    }

    .nav {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      color: var(--fg-dim);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--surface-dim);
      color: var(--fg);
    }

    .nav-item.active {
      background: rgba(245, 158, 11, 0.12);
      color: var(--primary);
      border: 1px solid rgba(245, 158, 11, 0.25);
      font-weight: 700;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .side-progress {
      margin: auto 16px 20px;
      padding: 16px;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .side-progress .lbl {
      font-size: 11.5px;
      color: var(--fg-faint);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .xp-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .xp-num {
      font-family: var(--head);
      font-weight: 800;
      font-size: 19px;
      color: var(--fg);
    }

    .streak {
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .bar {
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar>div {
      height: 100%;
      background: var(--primary-grad);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* Main column */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .hamburger {
      display: none;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 19px;
      line-height: 1;
      color: var(--fg);
      min-width: 40px;
      min-height: 40px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .hamburger:hover {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }

    .search-wrap {
      flex: 1;
      max-width: 440px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-size: 13.5px;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--fg-faint);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-md);
      max-height: 380px;
      overflow-y: auto;
      z-index: 50;
    }

    .search-results .sr-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .search-results .sr-item:last-child {
      border-bottom: none;
    }

    .search-results .sr-item:hover {
      background: var(--surface-dim);
    }

    .sr-kind {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--primary);
      font-weight: 700;
    }

    .sr-title {
      font-size: 14px;
      font-weight: 600;
      margin-top: 3px;
      color: var(--fg);
    }

    .topbar-spacer {
      flex: 1;
    }

    .mode-switcher {
      display: flex;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-dim);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-btn:hover {
      color: var(--fg);
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      font-weight: 700;
    }

    :root[data-theme="light"] .mode-btn.active {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    @media (max-width: 680px) {
      .mode-btn span.mode-text {
        display: none;
      }

      .mode-btn {
        padding: 6px 9px;
      }
    }

    .theme-toggle {
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }

    .content {
      padding: 32px 36px 70px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .content {
        padding: 22px 18px 60px;
      }
    }

    /* ============ REUSABLE UI & BUTTONS ============ */
    .eyebrow {
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .page-head {
      margin-bottom: 28px;
    }

    .page-head h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .page-head .sub {
      font-size: 15.5px;
      color: var(--fg-dim);
      max-width: 680px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    @media (max-width: 960px) {

      .grid.cols-3,
      .grid.cols-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {

      .grid.cols-2,
      .grid.cols-3,
      .grid.cols-4 {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 14px;
      font-family: var(--head);
      letter-spacing: -0.01em;
      border: 1.5px solid transparent;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.22s ease,
        border-color 0.22s ease;
    }

    /* --- Primary: deep indigo-violet with shimmer sweep --- */
    .btn-primary {
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #A855F7 100%);
      color: #FFFFFF !important;
      box-shadow: 0 6px 20px -4px rgba(139, 92, 246, 0.55);
    }

    /* Shimmer pseudo-element */
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 50%,
          transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.55s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 36px -6px rgba(139, 92, 246, 0.65),
        0 0 0 4px rgba(139, 92, 246, 0.18);
      background: linear-gradient(135deg, #4F52E8 0%, #7C3AED 50%, #9333EA 100%);
    }

    .btn-primary:hover::after {
      transform: translateX(100%);
    }

    .btn-primary:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* --- Outline: glass border with colour-fill on hover --- */
    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--fg);
      backdrop-filter: blur(4px);
    }

    .btn-outline::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.12) 100%);
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn-outline:hover {
      border-color: #8B5CF6;
      color: var(--fg);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.3),
        0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .btn-outline:hover::before {
      opacity: 1;
    }

    .btn-outline:active {
      transform: translateY(0px);
    }

    /* Light-mode tweaks */
    :root[data-theme="light"] .btn-outline {
      border-color: #CBD5E1;
      color: #1E293B;
    }

    :root[data-theme="light"] .btn-outline:hover {
      border-color: #7C3AED;
      color: #4F52E8;
    }

    /* Ghost (editor toolbar) — unchanged */
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--fg-dim);
      padding: 8px 12px;
    }

    .btn-ghost:hover {
      color: var(--fg);
      background: var(--surface-dim);
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
    }

    .tag-green {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .tag-amber {
      background: rgba(245, 158, 11, 0.15);
      color: var(--primary);
    }

    .tag-rose {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
    }

    .tag-blue {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
    }

    .tag-purple {
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
    }

    .tag-gray {
      background: var(--surface-dim);
      color: var(--fg-dim);
      border: 1px solid var(--border);
    }

    /* ============ BENTO HERO & SQUIRCLE CATEGORIES (Inspired by Reference Images) ============ */
    .hero-banner {
      position: relative;
      background: linear-gradient(135deg, rgba(24, 34, 52, 0.7) 0%, rgba(18, 24, 38, 0.95) 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 42px 40px;
      margin-bottom: 34px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    :root[data-theme="light"] .hero-banner {
      background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
      border-color: #E2E8F0;
    }

    .hero-glow {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }

    .hero-layout {
      display: flex;
      align-items: center;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .hero-text-col {
      max-width: 820px;
      width: 100%;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #F59E0B 0%, #EA580C 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 15.5px;
      color: var(--fg-dim);
      max-width: 680px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .hero-stats-row {
      display: flex;
      gap: 28px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      flex-wrap: wrap;
    }

    .hero-stat-item .h-num {
      font-size: 24px;
      font-weight: 800;
      font-family: var(--head);
      color: var(--fg);
    }

    .hero-stat-item .h-lbl {
      font-size: 12px;
      color: var(--fg-faint);
      margin-top: 2px;
    }

    /* Squircle Course Category Cards (Directly matching Image 1) */
    .cat-section {
      margin-bottom: 34px;
    }

    .cat-sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .cat-sec-head h2 {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) 100px;
      gap: 16px;
      align-items: center;
    }

    @media (max-width: 1040px) {
      .cat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .browse-all-btn {
        grid-column: span 2;
        flex-direction: row;
        justify-content: center;
        padding: 14px 20px;
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        gap: 12px;
      }

      .browse-circle {
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
    }

    @media (max-width: 600px) {
      .cat-grid {
        grid-template-columns: 1fr;
      }

      .browse-all-btn {
        grid-column: span 1;
      }

      .cat-sec-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }

    .squircle-card {
      height: 160px;
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFFFF;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .squircle-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5);
    }

    .squircle-card.c-magenta {
      background: linear-gradient(145deg, #F43F5E 0%, #BE123C 100%);
      box-shadow: 0 10px 24px -4px rgba(244, 63, 94, 0.4);
    }

    .squircle-card.c-orange {
      background: linear-gradient(145deg, #F59E0B 0%, #D97706 100%);
      box-shadow: 0 10px 24px -4px rgba(245, 158, 11, 0.4);
    }

    .squircle-card.c-cyan {
      background: linear-gradient(145deg, #06B6D4 0%, #0369A1 100%);
      box-shadow: 0 10px 24px -4px rgba(6, 182, 212, 0.4);
    }

    .squircle-card.c-purple {
      background: linear-gradient(145deg, #8B5CF6 0%, #6D28D9 100%);
      box-shadow: 0 10px 24px -4px rgba(139, 92, 246, 0.4);
    }

    .sq-icon {
      font-size: 24px;
    }

    .sq-title {
      font-family: var(--head);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .sq-line {
      width: 34px;
      height: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 999px;
    }

    .browse-all-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
    }

    .browse-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--primary-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 22px;
      font-weight: 800;
      box-shadow: var(--primary-grad-glow);
      transition: all 0.22s ease;
    }

    .browse-all-btn:hover .browse-circle {
      transform: scale(1.08) rotate(45deg);
    }

    .browse-lbl {
      font-size: 13px;
      font-weight: 700;
      color: var(--fg-dim);
    }

    /* ============ ROADMAP & LEVEL CARDS ============ */
    .roadmap-track {
      position: relative;
      padding-left: 30px;
      border-left: 2px solid var(--border);
      margin-left: 12px;
    }

    .level-node {
      position: relative;
      padding-bottom: 28px;
    }

    .level-node:last-child {
      padding-bottom: 0;
    }

    .level-dot {
      position: absolute;
      left: -41px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--fg-faint);
    }

    .level-dot.done {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #FFF;
    }

    .level-dot.current {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFF;
      box-shadow: var(--shadow-glow);
    }

    .level-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .level-card:hover {
      border-color: var(--primary);
      transform: translateX(3px);
    }

    .level-card .lh {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-card h3 {
      font-size: 17px;
      margin: 0;
    }

    .level-meta {
      font-size: 13px;
      color: var(--fg-faint);
      margin-top: 3px;
    }

    .level-card.locked {
      opacity: 0.65;
    }

    /* ============ LESSON VIEWER & CODEBOX ============ */
    .lesson-layout {
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }

    .lesson-toc {
      width: 260px;
      flex: 0 0 260px;
      position: sticky;
      top: 86px;
    }

    .toc-group {
      margin-bottom: 16px;
    }

    .toc-group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--fg-faint);
      font-weight: 800;
      margin: 0 0 8px 4px;
    }

    .toc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      color: var(--fg-dim);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    .toc-item:hover {
      background: var(--surface-dim);
      color: var(--fg);
    }

    .toc-item.active {
      background: rgba(245, 158, 11, 0.12);
      color: var(--primary);
      font-weight: 700;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .toc-check {
      font-size: 12px;
      width: 16px;
    }

    .lesson-body {
      flex: 1;
      min-width: 0;
    }

    @media (max-width: 900px) {
      .lesson-layout {
        flex-direction: column;
      }

      .lesson-toc {
        width: 100%;
        flex: none;
        position: static;
      }
    }

    .lesson-sec {
      margin-bottom: 28px;
    }

    .lesson-sec h3 {
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .lesson-sec .num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-dim);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: var(--mono);
      font-weight: 700;
    }

    .analogy-box {
      background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid var(--primary);
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Modern macOS style Codebox */
    .codebox {
      background: var(--code-bg);
      color: #E2E8F0;
      border-radius: 12px;
      padding: 16px 18px;
      font-family: var(--mono);
      font-size: 13px;
      overflow-x: auto;
      line-height: 1.65;
      white-space: pre;
      border: 1px solid var(--border);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .line-explain {
      display: flex;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 14px;
    }

    .line-explain:last-child {
      border-bottom: none;
    }

    .line-explain code {
      background: var(--surface-dim);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      flex: 0 0 auto;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .mistake {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .mistake .m-wrong {
      color: var(--accent-rose);
      font-weight: 800;
      font-size: 15px;
    }

    .mistake .m-right {
      color: var(--accent-green);
      font-weight: 700;
    }

    /* Quizzes */
    .quiz-q {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .quiz-q:last-child {
      border: none;
    }

    .quiz-q p.qtext {
      color: var(--fg);
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .quiz-opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      color: var(--fg);
      font-weight: 500;
      transition: all 0.18s ease;
    }

    .quiz-opt:hover {
      border-color: var(--primary);
      background: var(--surface-dim);
    }

    .quiz-opt.correct {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
      font-weight: 700;
    }

    .quiz-opt.wrong {
      background: rgba(244, 63, 94, 0.15);
      border-color: var(--accent-rose);
      color: var(--accent-rose);
      font-weight: 700;
    }

    .quiz-opt:disabled {
      cursor: default;
    }

    .next-box {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(234, 88, 12, 0.05) 100%);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 13px 24px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============ CODE PLAYGROUND ============ */
    .editor-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 18px 0;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .editor-tabs {
      display: flex;
      background: var(--surface-dim);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .etab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: var(--fg-dim);
      background: none;
      border: none;
      border-right: 1px solid var(--border);
      font-family: var(--mono);
    }

    .etab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .editor-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      padding: 6px 12px;
    }

    .editor-panes {
      display: flex;
      min-height: 280px;
    }

    .editor-pane {
      flex: 1;
      min-width: 0;
    }

    .editor-pane textarea {
      width: 100%;
      height: 280px;
      border: none;
      resize: vertical;
      padding: 16px;
      font-family: var(--mono);
      font-size: 13px;
      background: var(--surface);
      color: var(--fg);
      line-height: 1.6;
    }

    .editor-preview {
      flex: 1;
      min-width: 0;
      border-left: 1px solid var(--border);
      background: #FFFFFF;
    }

    .editor-preview iframe {
      width: 100%;
      height: 280px;
      border: none;
      display: block;
    }

    @media (max-width: 760px) {
      .editor-panes {
        flex-direction: column;
      }

      .editor-preview {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    .hint-block {
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .hint-block b {
      font-family: var(--head);
      font-size: 13px;
      color: var(--primary);
    }

    /* Projects */
    .proj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .proj-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .proj-bar {
      height: 4px;
      width: 100%;
    }

    .proj-body {
      padding: 18px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .proj-body h3 {
      font-size: 16.5px;
      margin-bottom: 6px;
    }

    .proj-body .pd {
      font-size: 13.5px;
      color: var(--fg-dim);
      flex: 1;
      margin-bottom: 14px;
    }

    .proj-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .skill-chip {
      font-size: 11px;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--fg-dim);
      margin-right: 4px;
      font-weight: 600;
    }

    /* Badges */
    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .badge .b-emoji {
      font-size: 34px;
      margin-bottom: 10px;
      filter: grayscale(1);
      opacity: .3;
    }

    .badge.unlocked .b-emoji {
      filter: none;
      opacity: 1;
    }

    .badge h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .badge p {
      font-size: 12px;
      margin: 0;
    }

    /* Glossary */
    .gloss-item {
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
    }

    .gloss-item:first-child {
      padding-top: 0;
    }

    .gloss-term {
      font-family: var(--head);
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--fg);
    }

    .gloss-related {
      margin-top: 10px;
    }

    .gloss-related span {
      font-size: 11.5px;
      color: var(--primary);
      background: rgba(245, 158, 11, 0.12);
      padding: 3px 9px;
      border-radius: 999px;
      margin-right: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ============ RESPONSIVE MEDIA QUERIES (TABLETS & PHONES) ============ */
    .lesson-toc-details>summary {
      list-style: none;
      cursor: default;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lesson-toc-details>summary::-webkit-details-marker {
      display: none;
    }

    .toc-toggle-badge {
      display: none;
    }

    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        max-width: 84vw;
        height: 100%;
        height: 100dvh;
        z-index: 50;
        transform: translateX(-100%);
        box-shadow: none;
        transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 35px rgba(0, 0, 0, 0.55);
      }

      .sidebar-close-btn {
        display: flex;
      }

      .hamburger {
        display: inline-flex;
      }

      .side-progress {
        margin-bottom: 80px;
      }

      .topbar {
        padding: 10px 14px;
        gap: 10px;
      }

      .search-wrap {
        flex: 1;
        min-width: 0;
        max-width: none;
      }

      .search-input {
        padding: 8px 12px 8px 34px;
        font-size: 13px;
      }

      .search-icon {
        left: 11px;
        font-size: 13px;
      }

      .topbar-spacer {
        display: none;
      }

      .mode-switcher {
        flex-shrink: 0;
      }

      .content {
        padding: 20px 16px 60px;
      }

      .hero-banner {
        padding: 26px 20px;
        border-radius: 20px;
        margin-bottom: 24px;
      }

      .hero-title {
        font-size: 30px;
      }

      .hero-actions {
        gap: 10px;
        margin-bottom: 22px;
      }

      .hero-stats-row {
        gap: 16px;
        padding-top: 16px;
      }

      .lesson-layout {
        flex-direction: column;
      }

      .lesson-toc {
        width: 100%;
        flex: none;
        position: static;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 22px;
      }

      .lesson-toc-details>summary {
        cursor: pointer;
      }

      .toc-toggle-badge {
        display: inline-block;
        font-size: 11px;
        background: rgba(245, 158, 11, 0.15);
        color: var(--primary);
        padding: 3px 8px;
        border-radius: 999px;
        font-weight: 700;
      }

      .toc-items-list {
        margin-top: 10px;
        max-height: 240px;
        overflow-y: auto;
      }
    }

    @media (max-width: 640px) {
      .content {
        padding: 16px 12px 60px;
      }

      .hero-banner {
        padding: 22px 16px;
        border-radius: 16px;
      }

      .hero-title {
        font-size: 26px;
      }

      .hero-sub {
        font-size: 14px;
        line-height: 1.55;
      }

      .hero-actions {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }

      .hero-actions .btn {
        width: 100%;
      }

      .hero-stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .hero-stat-item .h-num {
        font-size: 20px;
      }

      .hero-stat-item .h-lbl {
        font-size: 11px;
      }

      .page-head h1 {
        font-size: 25px;
      }

      .page-head .sub {
        font-size: 14px;
      }

<body>
  <div id="app"></div>

  <script>
    /* =========================================================================
       FOUNDRY — a beginner web-development learning platform
       Single-file SPA: hash router + localStorage-backed progress store.
       Sections in this file:
         1. CONTENT DATA  (levels, lessons, projects, glossary, achievements)
         2. STORE         (progress, xp, streak — persisted to localStorage)
         3. ROUTER + RENDER (page components)
         4. CODE PLAYGROUND (live HTML/CSS/JS preview)
       ========================================================================= */

    /* ---------------------------------------------------------------------
       1. CONTENT DATA
    --------------------------------------------------------------------- */

    const GLOSSARY = [
      { term: "HTML", simple: "The language you use to write the content and structure of a web page — headings, paragraphs, images, links.", tech: "HyperText Markup Language: a markup language that defines the structure of a document using nested elements.", example: "<h1>Hello</h1>", related: ["CSS", "DOM", "Semantic HTML"] },
      { term: "CSS", simple: "The language that styles your HTML — colors, spacing, layout, fonts.", tech: "Cascading Style Sheets: a stylesheet language used to describe the presentation of a document written in HTML.", example: "h1 { color: blue; }", related: ["HTML", "Selector", "Box Model"] },
      { term: "JavaScript", simple: "The language that makes web pages interactive — it can react to clicks, change content, and talk to servers.", tech: "A high-level, dynamically-typed scripting language that runs in the browser (and elsewhere) to add behavior to web pages.", example: "alert('Hi!');", related: ["DOM", "Function", "Variable"] },
      { term: "Variable", simple: "A labeled box where you store a value so you can use it later.", tech: "A named reference to a value stored in memory, declared with let, const, or var in JavaScript.", example: "let age = 25;", related: ["JavaScript", "Data type"] },
      { term: "Function", simple: "A reusable block of instructions you can run whenever you need it, like a recipe.", tech: "A block of code designed to perform a particular task, defined once and invoked (called) as needed.", example: "function greet(){ return 'hi'; }", related: ["Parameter", "Return"] },
      { term: "Array", simple: "A single list that holds multiple values in order, like a numbered shelf.", tech: "An ordered, zero-indexed collection of values stored under a single variable name.", example: "let colors = ['red','green','blue'];", related: ["Object", "Loop", "forEach"] },
      { term: "Object", simple: "A way to group related information together using labels, like a filled-out form.", tech: "A collection of key–value pairs used to represent structured data in JavaScript.", example: "let user = { name:'Ada', age:30 };", related: ["Array", "JSON"] },
      { term: "DOM", simple: "The browser's way of representing your HTML page as something JavaScript can read and change.", tech: "Document Object Model: a tree-like, in-memory representation of the HTML document that scripts can query and manipulate.", example: "document.getElementById('title')", related: ["JavaScript", "HTML", "querySelector"] },
      { term: "API", simple: "A way for two pieces of software to talk to each other — like a waiter taking your order to the kitchen.", tech: "Application Programming Interface: a defined set of rules that lets one program request data or services from another.", example: "fetch('https://api.example.com/users')", related: ["HTTP", "JSON", "fetch"] },
      { term: "HTTP", simple: "The set of rules browsers and servers use to send requests and responses to each other.", tech: "HyperText Transfer Protocol: the application-layer protocol used for transmitting web resources between clients and servers.", example: "GET /index.html HTTP/1.1", related: ["API", "Server", "Status code"] },
      { term: "JSON", simple: "A simple text format for sending structured data, built out of objects and arrays.", tech: "JavaScript Object Notation: a lightweight, language-independent data-interchange format based on JS object syntax.", example: '{"name":"Ada","age":30}', related: ["API", "Object", "fetch"] },
      { term: "Server", simple: "A computer somewhere else that stores your website and sends it to visitors when asked.", tech: "A program (and the machine running it) that listens for requests and returns responses, often over HTTP.", example: "A machine running Node.js on port 3000", related: ["Backend", "Hosting", "API"] },
      { term: "Database", simple: "An organized place to permanently store data so it isn't lost when the server restarts.", tech: "A structured system for storing, managing, and querying persistent data, often organized into tables.", example: "A users table with columns id, name, email", related: ["SQL", "Table", "Backend"] },
      { term: "SQL", simple: "A language for asking a database questions and telling it what to store, change, or delete.", tech: "Structured Query Language: the standard language for defining and manipulating relational databases.", example: "SELECT * FROM users WHERE age > 18;", related: ["Database", "Table"] },
      { term: "Git", simple: "A tool that saves snapshots of your code over time, so you can undo mistakes and track changes.", tech: "A distributed version-control system for tracking changes in source code during software development.", example: "git commit -m \"add login page\"", related: ["Repository", "GitHub"] },
      { term: "Repository", simple: "A project folder that Git is keeping a history of.", tech: "A storage location (often called a 'repo') containing a project's files and its full version history.", example: "github.com/you/my-portfolio", related: ["Git", "GitHub"] },
      { term: "Framework", simple: "A pre-built toolkit that gives you structure and shortcuts so you don't build everything from zero.", tech: "A reusable set of libraries, conventions, and tools that provides a foundation for building applications.", example: "React, Vue, Express", related: ["Library"] },
      { term: "Library", simple: "A collection of ready-made code you can borrow instead of writing it yourself.", tech: "A collection of pre-written functions/modules that a program can call, without dictating the app's structure.", example: "Using Chart.js to draw a graph", related: ["Framework"] },
      { term: "Frontend", simple: "Everything a visitor actually sees and clicks on in their browser.", tech: "The client-side portion of an application: the UI layer built with HTML, CSS, and JavaScript that runs in the browser.", example: "The layout, colors, and buttons of a site", related: ["Backend", "HTML", "CSS"] },
      { term: "Backend", simple: "The behind-the-scenes part of an app that handles data, logic, and security on a server.", tech: "The server-side portion of an application responsible for business logic, data storage, and APIs.", example: "Code that checks a password and saves an order", related: ["Frontend", "Server", "Database"] },

    /* ---------------------------------------------------------------------
       2. STORE — progress, xp, streak (persisted to localStorage)
    --------------------------------------------------------------------- */
    const STORE_KEY = "foundry_progress_v1";
    function loadStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          parsed.quizClaimed = parsed.quizClaimed || {};
          return parsed;
        }
      } catch (e) { console.warn("Could not read saved progress", e); }
      return {
        xp: 0, streak: 0, lastActive: null,
        completedLessons: [], completedProjects: [], quizScores: {}, quizClaimed: {}, perfectQuizzes: 0,
        unlockedAchievements: [], notes: {}, theme: "dark"
      };
    }
    let state = loadStore();
    function saveStore() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { console.warn("Could not save progress", e); }
    }
    function touchStreak() {
      const today = new Date().toDateString();
      if (state.lastActive === today) return;
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const yesterday = d.toDateString();
      state.streak = (state.lastActive === yesterday) ? state.streak + 1 : 1;
      state.lastActive = today;
      saveStore();
    }
    touchStreak();

    function addXP(amount, reason) {
      state.xp += amount;
      saveStore();
      showToast(`+${amount} XP — ${reason}`);
      checkAchievements();
    }
    function completeLesson(id) {
      if (state.completedLessons.includes(id)) return;
      state.completedLessons.push(id);
      saveStore();
      addXP(15, "lesson complete");
    }
    function completeProject(id) {
      if (state.completedProjects.includes(id)) return;
      state.completedProjects.push(id);
      saveStore();
      addXP(60, "project complete");
    }
    function recordQuiz(lessonId, correct, total) {
      state.quizScores[lessonId] = { correct, total };
      if (correct === total) state.perfectQuizzes++;
      if (!state.quizClaimed) state.quizClaimed = {};
      if (!state.quizClaimed[lessonId] && correct >= Math.ceil(total * 0.6)) {
        state.quizClaimed[lessonId] = true;
        addXP(5 * correct, "quiz passed");
      }
      saveStore();
    }
    function checkAchievements() {
      ACHIEVEMENTS.forEach(a => {
        if (!state.unlockedAchievements.includes(a.id) && a.check(state)) {
          state.unlockedAchievements.push(a.id);
          saveStore();
          setTimeout(() => showToast(`🏆 Achievement unlocked: ${a.name}`), 500);
        }
      });
    }
    checkAchievements();

    function levelProgress(levelId) {
      const lvl = LEVELS.find(l => l.id === levelId);
      if (!lvl) return 0;
      const totalLessons = lvl.lessons.length;
      const totalProjects = lvl.projectIds.length;
      const doneLessons = lvl.lessons.filter(l => state.completedLessons.includes(l.id)).length;
      const doneProjects = lvl.projectIds.filter(id => state.completedProjects.includes(id)).length;
      const total = totalLessons + totalProjects;
      const done = doneLessons + doneProjects;
      return total === 0 ? 0 : Math.round((done / total) * 100);
    }
    function xpForLevel(xp) { return Math.floor(xp / 150) + 1; }

    /* ---------------------------------------------------------------------
       3. ROUTER + RENDER
    --------------------------------------------------------------------- */
    function showToast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove("show"), 2600);
    }

    function navigate(hash) { location.hash = hash; }
    window.addEventListener("hashchange", render);
    window.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      render();
      // Global click listener attached once to prevent memory leaks
      document.addEventListener("click", (e) => {
        const results = document.getElementById("searchResults");
        if (results && !e.target.closest(".search-wrap")) {
          results.innerHTML = "";
          results.classList.remove("search-results");
        }
        const sidebar = document.getElementById("sidebar");
        const hamBtn = document.getElementById("hamBtn");
        if (sidebar && sidebar.classList.contains("open") && !sidebar.contains(e.target) && e.target !== hamBtn && !hamBtn.contains(e.target)) {
          sidebar.classList.remove("open");
        }
      });
    });

    function setMode(mode) {
      state.theme = mode;
      saveStore();
      applyTheme();
      showToast(mode === 'dark' ? "🌙 Switched to Dark Mode" : "☀️ Switched to Light Mode");
    }

    function toggleTheme() {
      const next = state.theme === 'dark' ? 'light' : 'dark';
      setMode(next);
    }

    function applyTheme() {
      if (state.theme === "light") document.documentElement.setAttribute("data-theme", "light");
      else document.documentElement.setAttribute("data-theme", "dark");

      document.querySelectorAll(".mode-btn").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-mode") === state.theme);
      });
    }

    function esc(s) {
      if (!s) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function findLesson(id) {
      for (const lvl of LEVELS) { const f = lvl.lessons.find(l => l.id === id); if (f) return { lesson: f, level: lvl }; }
      return null;
    }
    function findProject(id) { return PROJECTS.find(p => p.id === id); }

    const NAV_ITEMS = [
      { hash: "#/dashboard", icon: "🏠", label: "Dashboard" },
      { hash: "#/roadmap", icon: "🗺️", label: "Roadmap" },
      { hash: "#/learn", icon: "📘", label: "Learn" },
      { hash: "#/projects", icon: "🧩", label: "Projects" },
      { hash: "#/glossary", icon: "📖", label: "Glossary" },
      { hash: "#/achievements", icon: "🏆", label: "Achievements" },
    ];

    function render() {
      const hash = location.hash || "#/dashboard";
      const root = document.getElementById("app");
      root.innerHTML = shellHTML(hash);
      wireShell();

      const contentEl = document.getElementById("content");
      const [_, route, arg] = hash.split("/");
      if (hash.startsWith("#/dashboard") || hash === "#/") contentEl.innerHTML = pageDashboard();
      else if (hash.startsWith("#/roadmap")) contentEl.innerHTML = pageRoadmap();
      else if (hash.startsWith("#/learn/")) { contentEl.innerHTML = pageLesson(arg); wireLesson(arg); return; }
      else if (hash.startsWith("#/learn")) contentEl.innerHTML = pageLearnIndex();
      else if (hash.startsWith("#/projects/")) { contentEl.innerHTML = pageProjectDetail(arg); wireProjectDetail(arg); return; }
      else if (hash.startsWith("#/projects")) contentEl.innerHTML = pageProjects();

    function wireShell() {
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebarBackdrop");
      const closeBtn = document.getElementById("sidebarCloseBtn");

      function closeDrawer() {
        if (sidebar) sidebar.classList.remove("open");
        if (backdrop) backdrop.classList.remove("active");
        document.body.style.overflow = "";
      }

      function openDrawer() {
        if (sidebar) sidebar.classList.add("open");
        if (backdrop) backdrop.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      document.querySelectorAll("#sidebar [data-nav], .brand[data-nav]").forEach(b => {
        b._wired = true;
        b.addEventListener("click", () => {
          navigate(b.getAttribute("data-nav"));
          closeDrawer();
        });
      });

      const hamBtn = document.getElementById("hamBtn");
      if (hamBtn) {
        hamBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (sidebar && sidebar.classList.contains("open")) {
            closeDrawer();
          } else {
            openDrawer();
          }
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          closeDrawer();
        });
      }

      if (backdrop) {
        backdrop.addEventListener("click", closeDrawer);
      }

      document.querySelectorAll(".mode-btn").forEach(b => {
        b.addEventListener("click", () => {
          setMode(b.getAttribute("data-mode"));
        });
      });

      const input = document.getElementById("searchInput");
      const results = document.getElementById("searchResults");
      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) { results.innerHTML = ""; results.classList.remove("search-results"); return; }
        const hits = [];
        LEVELS.forEach(lvl => lvl.lessons.forEach(l => {
          if (l.title.toLowerCase().includes(q) || l.simple.toLowerCase().includes(q)) hits.push({ kind: "Lesson", title: l.title, hash: `#/learn/${l.id}` });
        }));
        PROJECTS.forEach(p => { if (p.title.toLowerCase().includes(q)) hits.push({ kind: "Project", title: p.title, hash: `#/projects/${p.id}` }); });
        GLOSSARY.forEach(g => { if (g.term.toLowerCase().includes(q) || g.simple.toLowerCase().includes(q)) hits.push({ kind: "Glossary", title: g.term, hash: `#/glossary` }); });
        if (hits.length === 0) { results.innerHTML = `<div class="sr-item"><div class="sr-title">No results</div></div>`; }
        else results.innerHTML = hits.slice(0, 8).map(h => `<div class="sr-item" data-h="${h.hash}"><div class="sr-kind">${h.kind}</div><div class="sr-title">${esc(h.title)}</div></div>`).join("");
        results.classList.add("search-results");
        results.querySelectorAll(".sr-item[data-h]").forEach(el => el.addEventListener("click", () => {
          navigate(el.getAttribute("data-h"));
          input.value = "";
          results.innerHTML = "";
          closeDrawer();
        }));
      });
    }

    function quizHTML(lesson) {
      return lesson.quiz.map((q, qi) => `

    function wireLesson(id) {
      const found = findLesson(id);
      if (!found) return;
      const { lesson } = found;
      let scoreCorrect = 0, answered = 0;

      document.querySelectorAll(".quiz-q").forEach(qEl => {
        const qi = +qEl.getAttribute("data-qi");
        const q = lesson.quiz[qi];
        qEl.querySelectorAll(".quiz-opt").forEach(btn => {
          btn.addEventListener("click", () => {
            if (qEl.querySelector(".quiz-opt.correct, .quiz-opt.wrong")) return; // already answered
            const oi = +btn.getAttribute("data-oi");
            answered++;
            if (oi === q.a) { btn.classList.add("correct"); scoreCorrect++; }
            else { btn.classList.add("wrong"); qEl.querySelectorAll(".quiz-opt")[q.a].classList.add("correct"); }
            qEl.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
            if (answered === lesson.quiz.length) {
              recordQuiz(id, scoreCorrect, lesson.quiz.length);
              document.getElementById("quizScoreLine").innerHTML = `<p style="font-weight:700; color:${scoreCorrect === lesson.quiz.length ? 'var(--accent-green)' : 'var(--fg)'}; margin-top:8px;">Score: ${scoreCorrect}/${lesson.quiz.length} ${scoreCorrect === lesson.quiz.length ? '— perfect! 🎯' : ''}</p>`;
            }
          });
        });
      });

      const markBtn = document.getElementById("markDoneBtn");
      if (markBtn) markBtn.addEventListener("click", () => {
        completeLesson(id);
        render();
      });

      if (lesson.playground) wirePlayground("lesson-" + id, lesson.playground);
      wireGenericButtons();
    }

    /* ---- Projects ---- */
    function pageProjects() {
      return `
  <div class="page-head">
    <div class="eyebrow">Build by doing</div>
    <h1>Projects</h1>
    <p class="sub">Real, scoped projects that get progressively harder. Each one gives you starter code, hints if you get stuck, and a full solution once you're ready to compare.</p>
  </div>
  <div class="grid cols-3">
    ${PROJECTS.map(p => {
        const lvl = LEVELS.find(l => l.id === p.level);
        const done = state.completedProjects.includes(p.id);
        return `<div class="proj-card" data-nav="#/projects/${p.id}" style="cursor:pointer;">
        <div class="proj-bar" style="background:${lvl.color};"></div>
        <div class="proj-body">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <h3>${esc(p.title)}</h3>
            ${done ? '<span class="tag tag-green">Done</span>' : ''}
          </div>
          <p class="pd">${p.difficulty} ${p.diffLabel} · ${p.time}</p>
          <div style="margin-bottom:10px;">${p.skills.map(s => `<span class="skill-chip">${esc(s)}</span>`).join("")}</div>
          <div class="proj-foot"><span class="tag tag-blue">${lvl.icon} ${lvl.title}</span></div>
        </div>
      </div>`;
      }).join("")}
    ${LEVELS.filter(l => l.status === 'planned').flatMap(l => [l]).length ? `
    <div class="card empty" style="grid-column:1/-1;">
      <div class="e-icon">🧩</div>
      <p>Projects for CSS, JavaScript, Git, APIs, databases, and full-stack levels are mapped in the roadmap and ship as those levels' lessons are written.</p>
    </div>` : ``}
  </div>`;
    }

    function pageProjectDetail(id) {
      const p = findProject(id);
      if (!p) return `<div class="empty"><div class="e-icon">🧩</div><h3>Project not found</h3></div>`;
      const lvl = LEVELS.find(l => l.id === p.level);
      const done = state.completedProjects.includes(id);
      return `
  <div class="page-head">
    <div class="eyebrow">${lvl.icon} ${lvl.title} project</div>
    <h1>${esc(p.title)}</h1>
    <p class="sub">${p.difficulty} ${p.diffLabel} · ⏱ ${p.time}</p>
  </div>

  <div class="grid cols-2" style="margin-bottom:20px;">
    <div class="card">
      <h3 style="font-size:14px;">Instructions</h3>
      <p>${esc(p.instructions)}</p>
      <h3 style="font-size:14px; margin-top:16px;">Requirements</h3>
      <ul style="margin:0; padding-left:18px; color:var(--fg-dim); font-size:13.5px;">${p.requirements.map(r => `<li style="margin-bottom:4px;">${r}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3 style="font-size:14px;">Skills you'll use</h3>
      <div style="margin-bottom:14px;">${p.skills.map(s => `<span class="skill-chip">${esc(s)}</span>`).join("")}</div>
      <h3 style="font-size:14px;">Expected result</h3>
      <p style="margin:0;">${esc(p.expected)}</p>
    </div>
  </div>

  <h3 style="font-size:15px; margin-bottom:8px;">Your workspace</h3>
  ${playgroundHTML("proj-" + id, p.starter)}

  <div class="grid cols-2" style="margin-top:20px;">
    <div class="card">
      <h3 style="font-size:14px;">Stuck? Progressive hints</h3>
      <div id="hintArea"></div>
      <button class="btn btn-outline btn-sm" id="hintBtn">Reveal next hint</button>
    </div>
    <div class="card">
      <h3 style="font-size:14px;">Solution</h3>
      <p style="font-size:13px;">Try it yourself before checking — you'll learn more that way.</p>
      <button class="btn btn-outline btn-sm" id="solBtn">Show solution</button>
      <div id="solArea" style="margin-top:10px;"></div>
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <h3 style="font-size:14px;">Extension challenges</h3>
    <ul style="margin:0; padding-left:18px; color:var(--fg-dim); font-size:13.5px;">${p.extensions.map(e => `<li style="margin-bottom:4px;">${e}</li>`).join("")}</ul>
  </div>

  <div class="next-box" style="margin-top:20px;">
    <p style="margin:0;">Happy with your build?</p>
    <button class="btn btn-primary" id="completeProjBtn">${done ? '✅ Project completed' : 'Mark project complete'}</button>
  </div>`;
    }

    function wireProjectDetail(id) {
      const p = findProject(id);
      if (!p) return;
      wirePlayground("proj-" + id, p.starter);

      let hintIdx = 0;
      const hintArea = document.getElementById("hintArea");
      document.getElementById("hintBtn").addEventListener("click", () => {
        if (hintIdx >= p.hints.length) return;
        const div = document.createElement("div");
        div.className = "hint-block";
        div.innerHTML = `<b>Hint ${hintIdx + 1}</b><br>${p.hints[hintIdx]}`;
        hintArea.appendChild(div);
        hintIdx++;
        if (hintIdx >= p.hints.length) document.getElementById("hintBtn").disabled = true;
      });

      document.getElementById("solBtn").addEventListener("click", () => {
        document.getElementById("solArea").innerHTML = `<div class="codebox">${esc(p.solution.html)}</div>`;
      });

      document.getElementById("completeProjBtn").addEventListener("click", () => {
        completeProject(id);
        render();
      });
      wireGenericButtons();
    }

    /* ---- Glossary ---- */
    function pageGlossary() {
      return `
  <div class="page-head">

    <h1>Glossary</h1>
    <p class="sub">Plain-language definitions for every term you'll run into, with the technical definition underneath.</p>

  <div class="card">
    ${GLOSSARY.map(g => `

        <div class="gloss-term">${esc(g.term)}</div>
        <p style="margin-bottom:6px;"><strong style="color:var(--fg);">In plain terms:</strong> ${esc(g.simple)}</p>
        <p style="margin-bottom:6px; font-size:13px;"><strong style="color:var(--fg);">Technical definition:</strong> ${esc(g.tech)}</p>
        <div class="codebox" style="padding:8px 12px; font-size:12px;">${esc(g.example)}</div>

    function pageAchievements() {
      return `

    /* ---------------------------------------------------------------------
       4. CODE PLAYGROUND — live HTML/CSS/JS preview
    --------------------------------------------------------------------- */
    function playgroundHTML(key, starter) {
      return `
  <div class="editor-wrap" id="pg-${key}">
    <div class="editor-tabs">
      <button class="etab active" data-tab="html">HTML</button>
      <button class="etab" data-tab="css">CSS</button>
      <button class="etab" data-tab="js">JS</button>
      <div class="editor-actions">
        <button class="btn btn-ghost btn-sm" data-act="run">▶ Run</button>
        <button class="btn btn-ghost btn-sm" data-act="reset">↺ Reset</button>
      </div>
    </div>
    <div class="editor-panes">
      <div class="editor-pane">
        <textarea data-lang="html" spellcheck="false">${esc(starter.html || "")}</textarea>
        <textarea data-lang="css" style="display:none;" spellcheck="false">${esc(starter.css || "")}</textarea>
        <textarea data-lang="js" style="display:none;" spellcheck="false">${esc(starter.js || "")}</textarea>
      </div>
      <div class="editor-preview"><iframe title="Live preview" sandbox="allow-scripts"></iframe></div>
    </div>
  </div>`;
    }
    function wirePlayground(key, starter) {
      const wrap = document.getElementById("pg-" + key);
      if (!wrap) return;
      const tabs = wrap.querySelectorAll(".etab");
      const areas = { html: wrap.querySelector('[data-lang="html"]'), css: wrap.querySelector('[data-lang="css"]'), js: wrap.querySelector('[data-lang="js"]') };
      const iframe = wrap.querySelector("iframe");

      function runPreview() {
        const safeJs = (areas.js.value || "").replace(/<\/script>/gi, "<\\/script>");
        const doc = `<!DOCTYPE html><html><head><style>${areas.css.value}</style></head><body>${areas.html.value}<script>${safeJs}<\/script></body></html>`;
        iframe.srcdoc = doc;
      }
      tabs.forEach(t => t.addEventListener("click", () => {
        tabs.forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        Object.values(areas).forEach(a => a.style.display = "none");
        areas[t.getAttribute("data-tab")].style.display = "block";
      }));
      wrap.querySelector('[data-act="run"]').addEventListener("click", runPreview);
      wrap.querySelector('[data-act="reset"]').addEventListener("click", () => {
        areas.html.value = starter.html || ""; areas.css.value = starter.css || ""; areas.js.value = starter.js || "";
        runPreview();
      });
      Object.values(areas).forEach(a => a.addEventListener("input", debounce(runPreview, 500)));
      runPreview();
    }
    function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

    /* ---- generic [data-nav] wiring used on cards outside the shell ---- */
    function wireGenericButtons() {
      document.querySelectorAll("[data-nav]").forEach(el => {
        if (el._wired) return;
        el._wired = true;
        el.addEventListener("click", (e) => {
          const h = el.getAttribute("data-nav");
          if (h) navigate(h);
        });
      });
    }
  </script>
</body>
