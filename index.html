<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Foundry. — Learn to Build the Web</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ============ DESIGN TOKENS & THEMING ============ */
    :root {
      /* Brand Accents */
      --primary: #F59E0B;
      --primary-hover: #D97706;
      --primary-glow: rgba(245, 158, 11, 0.4);
      --primary-grad: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
      --primary-grad-glow: 0 10px 25px -4px rgba(234, 88, 12, 0.45);

      --accent-purple: #8B5CF6;
      --accent-cyan: #06B6D4;
      --accent-rose: #F43F5E;
      --accent-green: #10B981;
      --accent-blue: #3B82F6;

      /* Fonts */
      --head: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'IBM Plex Mono', Consolas, monospace;

      /* Radii */
      --radius: 18px;
      --radius-sm: 10px;
      --radius-pill: 9999px;

      /* Default Dark Mode (Inspired by E-Online & Class) */
      --bg: #0B0F17;
      --surface: #121826;
      --surfacgve-hover: #172033;
      --surface-dim: #182234;
      --surface-glass: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-focus: rgba(245, 158, 11, 0.5);

      --fg: #F8FAFC;
      --fg-dim: #94A3B8;
      --fg-faint: #64748B;
      --code-bg: #070B11;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 25px rgba(245, 158, 11, 0.25);
    }

    :root[data-theme="light"] {
      /* Background — warm stone, not blinding white */
      --bg: #EEF0F3;
      --surface: #F5F6F8;
      --surface-hover: #EAEDF1;
      --surface-dim: #E4E8EE;
      --surface-glass: rgba(238, 240, 243, 0.92);

      /* Borders — visible but not harsh */
      --border: #C8CDD8;
      --border-subtle: #DDE0E8;
      --border-focus: rgba(217, 119, 6, 0.55);

      /* Text — deep ink, not pure black */
      --fg: #1A2035;
      --fg-dim: #3D4A62;
      --fg-faint: #7A8499;
      --code-bg: #1A2035;

      /* Shadows — more depth for warmth */
      --shadow-sm: 0 2px 10px rgba(20, 30, 60, 0.09);
      --shadow-md: 0 12px 32px -8px rgba(20, 30, 60, 0.16);
      --shadow-glow: 0 0 28px rgba(217, 119, 6, 0.18);

      /* Primary — slightly deeper amber for contrast on light bg */
      --primary: #C27B0B;
      --primary-hover: #A86A09;
      --primary-glow: rgba(194, 123, 11, 0.35);
      --primary-grad: linear-gradient(135deg, #D97706 0%, #C2440C 100%);
      --primary-grad-glow: 0 10px 25px -4px rgba(194, 68, 12, 0.35);

      /* Accents — slightly deeper so they pop on the muted bg */
      --accent-purple: #7C3AED;
      --accent-cyan: #0891B2;
      --accent-rose: #E11D48;
      --accent-green: #059669;
      --accent-blue: #2563EB;
    }

    /* ============ DARK MODE — COLOUR DAMPING ============ */
    /* Muted accent palette — still identifiable but not neon-vivid */
    :root[data-theme="dark"] {
      --accent-purple: #7C6FA0;
      /* was #8B5CF6 */
      --accent-cyan: #3A8FA3;
      /* was #06B6D4 */
      --accent-rose: #A0445A;
      /* was #F43F5E */
      --accent-green: #3A8C6E;
      /* was #10B981 */
      --accent-blue: #4A72A8;
      /* was #3B82F6 */

      /* Primary amber — slightly cooled */
      --primary: #D4880A;
      --primary-hover: #B8730A;
      --primary-glow: rgba(212, 136, 10, 0.25);
      --primary-grad: linear-gradient(135deg, #C47F0A 0%, #9A4A08 100%);
      --primary-grad-glow: 0 10px 25px -4px rgba(156, 74, 8, 0.3);

      /* Softer glow in body bg */
      --shadow-glow: 0 0 20px rgba(212, 136, 10, 0.12);
    }

    /* Squircle cards — modern glowing glass cards */
    :root[data-theme="dark"] .squircle-card.c-magenta {
      background: linear-gradient(145deg, rgba(159, 18, 57, 0.45) 0%, rgba(80, 7, 36, 0.75) 100%);
      border: 1px solid rgba(244, 63, 94, 0.45);
      box-shadow: 0 8px 25px -4px rgba(244, 63, 94, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="dark"] .squircle-card.c-magenta:hover {
      box-shadow: 0 16px 32px -4px rgba(244, 63, 94, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="dark"] .squircle-card.c-orange {
      background: linear-gradient(145deg, rgba(180, 83, 9, 0.45) 0%, rgba(120, 53, 15, 0.75) 100%);
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 8px 25px -4px rgba(245, 158, 11, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="dark"] .squircle-card.c-orange:hover {
      box-shadow: 0 16px 32px -4px rgba(245, 158, 11, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="dark"] .squircle-card.c-cyan {
      background: linear-gradient(145deg, rgba(14, 116, 144, 0.45) 0%, rgba(8, 51, 68, 0.75) 100%);
      border: 1px solid rgba(6, 182, 212, 0.45);
      box-shadow: 0 8px 25px -4px rgba(6, 182, 212, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="dark"] .squircle-card.c-cyan:hover {
      box-shadow: 0 16px 32px -4px rgba(6, 182, 212, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="dark"] .squircle-card.c-purple {
      background: linear-gradient(145deg, rgba(109, 40, 217, 0.45) 0%, rgba(76, 29, 149, 0.75) 100%);
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 8px 25px -4px rgba(139, 92, 246, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="dark"] .squircle-card.c-purple:hover {
      box-shadow: 0 16px 32px -4px rgba(139, 92, 246, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="dark"] .squircle-card.c-green {
      background: linear-gradient(145deg, rgba(4, 120, 87, 0.45) 0%, rgba(6, 78, 59, 0.75) 100%);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 8px 25px -4px rgba(16, 185, 129, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="dark"] .squircle-card.c-green:hover {
      box-shadow: 0 16px 32px -4px rgba(16, 185, 129, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="dark"] .squircle-card.c-sky {
      background: linear-gradient(145deg, rgba(3, 105, 161, 0.45) 0%, rgba(12, 74, 110, 0.75) 100%);
      border: 1px solid rgba(14, 165, 233, 0.45);
      box-shadow: 0 8px 25px -4px rgba(14, 165, 233, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="dark"] .squircle-card.c-sky:hover {
      box-shadow: 0 16px 32px -4px rgba(14, 165, 233, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    /* Hero glow — much softer in dark mode */
    :root[data-theme="dark"] .hero-glow {
      background: radial-gradient(circle, rgba(180, 100, 10, 0.10) 0%, transparent 70%);
    }

    /* Gradient text — warm but not electric */
    :root[data-theme="dark"] .gradient-text {
      background: linear-gradient(135deg, #C47F0A 0%, #8A3808 50%, #7A2A48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Browse-all circle — toned primary */
    :root[data-theme="dark"] .browse-circle {
      background: var(--primary-grad);
    }

    /* Body background noise — suppress bright glow blobs in dark mode */
    :root[data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 85% 10%, rgba(180, 100, 8, 0.03) 0%, transparent 45%),
        radial-gradient(circle at 10% 85%, rgba(80, 50, 120, 0.02) 0%, transparent 45%);
    }

    /* ============ LIGHT MODE — OVERRIDES ============ */
    /* Body — soft warm slate gradient, no harsh white */
    :root[data-theme="light"] body {
      background-image:
        radial-gradient(circle at 80% 8%, rgba(195, 120, 10, 0.07) 0%, transparent 50%),
        radial-gradient(circle at 15% 90%, rgba(80, 50, 190, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.03) 0%, transparent 70%);
    }

    /* Gradient hero text — richer amber-to-rose on light bg */
    :root[data-theme="light"] .gradient-text {
      background: linear-gradient(135deg, #B45309 0%, #9A2714 50%, #881337 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Hero glow — warm amber tint */
    :root[data-theme="light"] .hero-glow {
      background: radial-gradient(circle, rgba(195, 120, 10, 0.12) 0%, transparent 70%);
    }

    /* Sidebar — slightly deeper surface so it stands apart from content */
    :root[data-theme="light"] .sidebar {
      background: #E2E6ED;
      border-right: 1px solid #BEC5D4;
    }

    /* Topbar — glassy slate instead of stark white */
    :root[data-theme="light"] .topbar {
      background: rgba(224, 228, 236, 0.94);
      border-bottom: 1px solid #C0C8D8;
    }

    /* Cards — elevated vs bg */
    :root[data-theme="light"] .card {
      background: #EBEEF4;
      border: 1px solid #C5CAD8;
    }

    /* Search input */
    :root[data-theme="light"] .search-input {
      background: #E4E8EE;
      border-color: #C0C8D8;
    }

    /* Progress bar track */
    :root[data-theme="light"] .bar {
      background: #CDD2DE;
    }

    /* Nav item active — amber tinted */
    :root[data-theme="light"] .nav-item.active {
      background: rgba(180, 83, 9, 0.1);
      border-color: rgba(180, 83, 9, 0.3);
    }

    /* Squircle cards — full saturation in light mode */
    :root[data-theme="light"] .squircle-card.c-magenta {
      background: linear-gradient(145deg, #F43F5E 0%, #BE123C 100%);
      border-color: rgba(190, 18, 60, 0.25);
      box-shadow: 0 8px 24px -4px rgba(244, 63, 94, 0.35);
    }
    :root[data-theme="light"] .squircle-card.c-orange {
      background: linear-gradient(145deg, #F59E0B 0%, #D97706 100%);
      border-color: rgba(180, 83, 9, 0.25);
      box-shadow: 0 8px 24px -4px rgba(245, 158, 11, 0.35);
    }
    :root[data-theme="light"] .squircle-card.c-cyan {
      background: linear-gradient(145deg, #06B6D4 0%, #0369A1 100%);
      border-color: rgba(6, 182, 212, 0.25);
      box-shadow: 0 8px 24px -4px rgba(6, 182, 212, 0.35);
    }
    :root[data-theme="light"] .squircle-card.c-purple {
      background: linear-gradient(145deg, #8B5CF6 0%, #6D28D9 100%);
      border-color: rgba(109, 40, 217, 0.25);
      box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.35);
    }
    :root[data-theme="light"] .squircle-card.c-green {
      background: linear-gradient(145deg, #10B981 0%, #059669 100%);
      border-color: rgba(5, 150, 105, 0.25);
      box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.35);
    }
    :root[data-theme="light"] .squircle-card.c-sky {
      background: linear-gradient(145deg, #0EA5E9 0%, #0284C7 100%);
      border-color: rgba(14, 165, 233, 0.25);
      box-shadow: 0 8px 24px -4px rgba(14, 165, 233, 0.35);
    }

    /* Browse circle */
    :root[data-theme="light"] .browse-circle {
      border-color: #D97706;
      color: #D97706;
      background: rgba(217, 119, 6, 0.08);
      box-shadow: 0 0 18px rgba(217, 119, 6, 0.2);
    }
    :root[data-theme="light"] .browse-all-btn:hover .browse-circle {
      background: #D97706;
      color: #FFFFFF;
      box-shadow: 0 0 28px rgba(217, 119, 6, 0.5);
    }

    /* Analogy box */
    :root[data-theme="light"] .analogy-box {
      background: rgba(180, 83, 9, 0.07);
      border-left-color: #D97706;
    }

    /* Challenge box */
    :root[data-theme="light"] .challenge-box {
      background: rgba(109, 40, 217, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 85% 10%, rgba(245, 158, 11, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 10% 85%, rgba(139, 92, 246, 0.05) 0%, transparent 45%);
      color: var(--fg);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--head);
      color: var(--fg);
      margin: 0 0 .4em;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      line-height: 1.65;
      color: var(--fg-dim);
      margin: 0 0 1em;
      font-size: 14.5px;
    }

    code,
    pre,
    .mono {
      font-family: var(--mono);
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      font-family: var(--head);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    ::selection {
      background: rgba(245, 158, 11, 0.3);
      color: #FFF;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Subtle blueprint texture */
    .grid-tex {
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    /* ============ APP SHELL ============ */
    #app {
      display: flex;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      position: relative;
    }

    /* Mobile Backdrop for Sidebar */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .sidebar-backdrop.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 30;
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header .brand {
      border-bottom: none;
      flex: 1;
    }

    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--fg-dim);
      font-size: 20px;
      padding: 10px 16px;
      cursor: pointer;
      line-height: 1;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .sidebar-close-btn:hover {
      color: var(--fg);
      background: var(--surface-dim);
    }

    .brand {
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.45));
      transition: transform 0.22s ease;
    }

    .brand:hover .brand-logo-img {
      transform: scale(1.05);
    }

    .brand-name {
      font-family: var(--head);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.03em;
      color: var(--fg);
    }

    .brand-name span {
      color: var(--primary);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--fg-faint);
      margin-top: -1px;
    }

    .nav {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      color: var(--fg-dim);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--surface-dim);
      color: var(--fg);
    }

    .nav-item.active {
      background: rgba(245, 158, 11, 0.12);
      color: var(--primary);
      border: 1px solid rgba(245, 158, 11, 0.25);
      font-weight: 700;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .side-progress {
      margin: auto 16px 20px;
      padding: 16px;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .side-progress .lbl {
      font-size: 11.5px;
      color: var(--fg-faint);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .xp-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .xp-num {
      font-family: var(--head);
      font-weight: 800;
      font-size: 19px;
      color: var(--fg);
    }

    .streak {
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .bar {
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar>div {
      height: 100%;
      background: var(--primary-grad);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* Main column */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .hamburger {
      display: none;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 19px;
      line-height: 1;
      color: var(--fg);
      min-width: 40px;
      min-height: 40px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .hamburger:hover {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }

    .search-wrap {
      flex: 1;
      max-width: 440px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-size: 13.5px;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--fg-faint);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-md);
      max-height: 380px;
      overflow-y: auto;
      z-index: 50;
    }

    .search-results .sr-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .search-results .sr-item:last-child {
      border-bottom: none;
    }

    .search-results .sr-item:hover {
      background: var(--surface-dim);
    }

    .sr-kind {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--primary);
      font-weight: 700;
    }

    .sr-title {
      font-size: 14px;
      font-weight: 600;
      margin-top: 3px;
      color: var(--fg);
    }

    .topbar-spacer {
      flex: 1;
    }

    .mode-switcher {
      display: flex;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-dim);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-btn:hover {
      color: var(--fg);
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      font-weight: 700;
    }

    :root[data-theme="light"] .mode-btn.active {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    @media (max-width: 680px) {
      .mode-btn span.mode-text {
        display: none;
      }

      .mode-btn {
        padding: 6px 9px;
      }
    }

    .theme-toggle {
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }

    .content {
      padding: 32px 36px 70px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .content {
        padding: 22px 18px 60px;
      }
    }

    /* ============ REUSABLE UI & BUTTONS ============ */
    .eyebrow {
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .page-head {
      margin-bottom: 28px;
    }

    .page-head h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .page-head .sub {
      font-size: 15.5px;
      color: var(--fg-dim);
      max-width: 680px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    @media (max-width: 960px) {

      .grid.cols-3,
      .grid.cols-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {

      .grid.cols-2,
      .grid.cols-3,
      .grid.cols-4 {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 14px;
      font-family: var(--head);
      letter-spacing: -0.01em;
      border: 1.5px solid transparent;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.22s ease,
        border-color 0.22s ease;
    }

    /* --- Primary: deep indigo-violet with shimmer sweep --- */
    .btn-primary {
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #A855F7 100%);
      color: #FFFFFF !important;
      box-shadow: 0 6px 20px -4px rgba(139, 92, 246, 0.55);
    }

    /* Shimmer pseudo-element */
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 50%,
          transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.55s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 36px -6px rgba(139, 92, 246, 0.65),
        0 0 0 4px rgba(139, 92, 246, 0.18);
      background: linear-gradient(135deg, #4F52E8 0%, #7C3AED 50%, #9333EA 100%);
    }

    .btn-primary:hover::after {
      transform: translateX(100%);
    }

    .btn-primary:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* --- Outline: glass border with colour-fill on hover --- */
    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--fg);
      backdrop-filter: blur(4px);
    }

    .btn-outline::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.12) 100%);
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn-outline:hover {
      border-color: #8B5CF6;
      color: var(--fg);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.3),
        0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .btn-outline:hover::before {
      opacity: 1;
    }

    .btn-outline:active {
      transform: translateY(0px);
    }

    /* Light-mode tweaks */
    :root[data-theme="light"] .btn-outline {
      border-color: #CBD5E1;
      color: #1E293B;
    }

    :root[data-theme="light"] .btn-outline:hover {
      border-color: #7C3AED;
      color: #4F52E8;
    }

    /* Ghost (editor toolbar) — unchanged */
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--fg-dim);
      padding: 8px 12px;
    }

    .btn-ghost:hover {
      color: var(--fg);
      background: var(--surface-dim);
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
    }

    .tag-green {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .tag-amber {
      background: rgba(245, 158, 11, 0.15);
      color: var(--primary);
    }

    .tag-rose {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
    }

    .tag-blue {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
    }

    .tag-purple {
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
    }

    .tag-gray {
      background: var(--surface-dim);
      color: var(--fg-dim);
      border: 1px solid var(--border);
    }

    /* ============ BENTO HERO & SQUIRCLE CATEGORIES (Inspired by Reference Images) ============ */
    .hero-banner {
      position: relative;
      background: linear-gradient(135deg, rgba(24, 34, 52, 0.7) 0%, rgba(18, 24, 38, 0.95) 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 42px 40px;
      margin-bottom: 34px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    :root[data-theme="light"] .hero-banner {
      background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
      border-color: #E2E8F0;
    }

    .hero-glow {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }

    .hero-layout {
      display: flex;
      align-items: center;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .hero-text-col {
      max-width: 820px;
      width: 100%;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #F59E0B 0%, #EA580C 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 15.5px;
      color: var(--fg-dim);
      max-width: 680px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .hero-stats-row {
      display: flex;
      gap: 28px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      flex-wrap: wrap;
    }

    .hero-stat-item .h-num {
      font-size: 24px;
      font-weight: 800;
      font-family: var(--head);
      color: var(--fg);
    }

    .hero-stat-item .h-lbl {
      font-size: 12px;
      color: var(--fg-faint);
      margin-top: 2px;
    }

    /* Squircle Course Category Cards (Directly matching Image 1) */
    .cat-section {
      margin-bottom: 34px;
    }

    .cat-sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .cat-sec-head h2 {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .squircle-card {
      height: 160px;
      border-radius: 20px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFFFF;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .squircle-card:hover {
      transform: translateY(-5px);
    }

    .squircle-card.c-magenta {
      background: linear-gradient(145deg, rgba(190, 24, 93, 0.45) 0%, rgba(136, 19, 55, 0.75) 100%);
      border: 1px solid rgba(244, 63, 94, 0.45);
      box-shadow: 0 8px 24px -4px rgba(244, 63, 94, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .squircle-card.c-magenta:hover {
      box-shadow: 0 16px 32px -4px rgba(244, 63, 94, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .squircle-card.c-orange {
      background: linear-gradient(145deg, rgba(217, 119, 6, 0.45) 0%, rgba(146, 64, 14, 0.75) 100%);
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 8px 24px -4px rgba(245, 158, 11, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .squircle-card.c-orange:hover {
      box-shadow: 0 16px 32px -4px rgba(245, 158, 11, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .squircle-card.c-cyan {
      background: linear-gradient(145deg, rgba(8, 145, 178, 0.45) 0%, rgba(21, 94, 117, 0.75) 100%);
      border: 1px solid rgba(6, 182, 212, 0.45);
      box-shadow: 0 8px 24px -4px rgba(6, 182, 212, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .squircle-card.c-cyan:hover {
      box-shadow: 0 16px 32px -4px rgba(6, 182, 212, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .squircle-card.c-purple {
      background: linear-gradient(145deg, rgba(124, 58, 237, 0.45) 0%, rgba(76, 29, 149, 0.75) 100%);
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .squircle-card.c-purple:hover {
      box-shadow: 0 16px 32px -4px rgba(139, 92, 246, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .squircle-card.c-green {
      background: linear-gradient(145deg, rgba(5, 150, 105, 0.45) 0%, rgba(6, 78, 59, 0.75) 100%);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .squircle-card.c-green:hover {
      box-shadow: 0 16px 32px -4px rgba(16, 185, 129, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .squircle-card.c-sky {
      background: linear-gradient(145deg, rgba(2, 132, 199, 0.45) 0%, rgba(12, 74, 110, 0.8) 100%);
      border: 1px solid rgba(14, 165, 233, 0.45);
      box-shadow: 0 8px 24px -4px rgba(14, 165, 233, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .squircle-card.c-sky:hover {
      box-shadow: 0 16px 32px -4px rgba(14, 165, 233, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .squircle-card.c-wide {
      grid-column: span 2;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .sq-wide-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      z-index: 2;
    }

    .sq-phone-graphic {
      position: absolute;
      right: 22px;
      bottom: -18px;
      width: 106px;
      height: 144px;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .squircle-card:hover .sq-phone-graphic {
      transform: translateY(-5px) scale(1.04);
    }

    .phone-body {
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #0f172a 0%, #020617 100%);
      border: 3px solid rgba(56, 189, 248, 0.45);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5), 0 0 24px rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 7px;
    }

    .phone-island {
      width: 26px;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .phone-atom-svg {
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
    }

    .sq-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .sq-arrow {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 700;
      transition: all 0.22s ease;
    }

    .squircle-card:hover .sq-arrow {
      color: #FFFFFF;
      transform: translateX(4px);
    }

    .sq-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .sq-title {
      font-family: var(--head);
      font-size: 16.5px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .sq-line {
      width: 32px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      transition: width 0.25s ease;
    }

    .squircle-card:hover .sq-line {
      width: 46px;
    }

    .squircle-card.c-magenta .sq-line { background: #FB7185; box-shadow: 0 0 8px rgba(251, 113, 133, 0.6); }
    .squircle-card.c-orange .sq-line { background: #FBBF24; box-shadow: 0 0 8px rgba(251, 191, 36, 0.6); }
    .squircle-card.c-cyan .sq-line { background: #22D3EE; box-shadow: 0 0 8px rgba(34, 211, 238, 0.6); }
    .squircle-card.c-purple .sq-line { background: #A78BFA; box-shadow: 0 0 8px rgba(167, 139, 250, 0.6); }
    .squircle-card.c-green .sq-line { background: #34D399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.6); }
    .squircle-card.c-sky .sq-line { background: #38BDF8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }

    .browse-all-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      height: 160px;
      transition: all 0.25s ease;
    }

    .browse-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #F59E0B;
      background: rgba(245, 158, 11, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F59E0B;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.25);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .browse-all-btn:hover .browse-circle {
      transform: scale(1.1);
      background: #F59E0B;
      color: #0B0F17;
      box-shadow: 0 0 28px rgba(245, 158, 11, 0.6);
    }

    .browse-lbl {
      font-size: 13px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: 0.02em;
    }

    @media (max-width: 1100px) {
      .cat-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .squircle-card.c-wide {
        grid-column: span 2;
      }
      .browse-all-btn {
        grid-column: span 1;
      }
    }

    @media (max-width: 740px) {
      .cat-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .squircle-card.c-wide {
        grid-column: span 2;
      }
      .browse-all-btn {
        grid-column: span 2;
        flex-direction: row;
        height: auto;
        padding: 14px 20px;
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
      }
      .browse-circle {
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      .cat-grid {
        grid-template-columns: 1fr;
      }
      .squircle-card.c-wide {
        grid-column: span 1;
      }
      .browse-all-btn {
        grid-column: span 1;
      }
      .cat-sec-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }

    /* ============ ROADMAP & LEVEL CARDS ============ */
    .roadmap-track {
      position: relative;
      padding-left: 30px;
      border-left: 2px solid var(--border);
      margin-left: 12px;
    }

    .level-node {
      position: relative;
      padding-bottom: 28px;
    }

    .level-node:last-child {
      padding-bottom: 0;
    }

    .level-dot {
      position: absolute;
      left: -41px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--fg-faint);
    }

    .level-dot.done {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #FFF;
    }

    .level-dot.current {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFF;
      box-shadow: var(--shadow-glow);
    }

    .level-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .level-card:hover {
      border-color: var(--primary);
      transform: translateX(3px);
    }

    .level-card .lh {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-card h3 {
      font-size: 17px;
      margin: 0;
    }

    .level-meta {
      font-size: 13px;
      color: var(--fg-faint);
      margin-top: 3px;
    }

    .level-card.locked {
      opacity: 0.65;
    }

    /* ============ LESSON VIEWER & CODEBOX ============ */
    .lesson-breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .lesson-breadcrumb::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .lesson-bc-level {
      cursor: pointer;
      color: var(--primary);
      transition: opacity 0.15s;
    }

    .lesson-bc-level:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .lesson-bc-sep {
      color: var(--fg-faint);
      font-weight: 400;
      margin: 0 2px;
    }

    .lesson-bc-current {
      color: var(--fg-dim);
    }

    .lesson-page-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .lesson-page-title {
      font-family: var(--head);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.25;
      color: var(--fg);
      margin: 0;
    }

    .lesson-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .lesson-toc {
      width: 270px;
      flex: 0 0 270px;
      position: sticky;
      top: 86px;
    }

    .toc-group {
      margin-bottom: 16px;
    }

    .toc-group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--fg-faint);
      font-weight: 800;
      margin: 0 0 8px 4px;
    }

    .toc-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--fg-dim);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      margin-bottom: 3px;
    }

    .toc-item:hover {
      background: var(--surface-dim);
      color: var(--fg);
    }

    .toc-item.active {
      background: rgba(245, 158, 11, 0.12);
      color: var(--primary);
      font-weight: 700;
      border-color: rgba(245, 158, 11, 0.3);
    }

    :root[data-theme="light"] .toc-item.active {
      background: #FFF7ED;
      color: #9A3412;
      border-color: #FDBA74;
    }

    .toc-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 18px;
      flex-shrink: 0;
    }

    .toc-empty-dot {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--fg-faint);
      opacity: 0.65;
    }

    .toc-active-dot {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .toc-done-dot {
      color: var(--accent-green);
      font-weight: 900;
      font-size: 12px;
    }

    .toc-label {
      flex: 1;
    }

    .toc-lesson-nav {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .toc-nav-btn {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-dim);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .toc-nav-btn:hover {
      background: var(--surface-dim);
      color: var(--fg);
      border-color: var(--primary);
    }

    .toc-nav-next {
      color: var(--primary);
      font-weight: 700;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .lesson-body {
      flex: 1;
      min-width: 0;
    }

    @media (max-width: 900px) {
      .lesson-layout {
        flex-direction: column;
      }

      .lesson-toc {
        width: 100%;
        flex: none;
        position: static;
      }
    }

    .lesson-sec {
      margin-bottom: 36px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .lesson-sec-last {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .lsec-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .lsec-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-dim);
      border: 1.5px solid var(--border);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: var(--mono);
      font-weight: 800;
      flex-shrink: 0;
    }

    .lsec-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--fg);
      font-weight: 800;
    }

    .lsec-body {
      font-size: 15px;
      line-height: 1.7;
      color: var(--fg-dim);
      margin: 0;
    }

    .lsec-note {
      font-size: 13.5px;
      color: var(--fg-dim);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .lsec-tryit {
      font-size: 15px;
      color: var(--fg-dim);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .analogy-box {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: rgba(245, 158, 11, 0.07);
      border: 1px solid rgba(245, 158, 11, 0.22);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      padding: 18px 20px;
      line-height: 1.65;
      font-size: 15px;
      color: var(--fg);
    }

    :root[data-theme="light"] .analogy-box {
      background: #FFFBEB;
      border-color: #FDE68A;
      border-left-color: #D97706;
    }

    .analogy-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      font-size: 22px;
      flex-shrink: 0;
    }

    .analogy-box p {
      margin: 0;
      align-self: center;
    }

    /* Modern macOS style Codebox */
    .codebox-wrap {
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .codebox-chrome {
      background: #0D1117;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cb-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .cb-red {
      background: #FF5F56;
    }

    .cb-yellow {
      background: #FFBD2E;
    }

    .cb-green {
      background: #27C93F;
    }

    .cb-filename {
      margin-left: 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .codebox {
      background: var(--code-bg);
      color: #E2E8F0;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 13.5px;
      overflow-x: auto;
      line-height: 1.65;
      white-space: pre;
      border: none;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
      margin: 0;
    }

    .line-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .line-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .line-code {
      background: var(--surface-dim);
      color: var(--primary);
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .line-desc {
      font-size: 14px;
      color: var(--fg-dim);
      line-height: 1.5;
    }

    .mistakes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mistake-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .mistake-wrong {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--accent-rose);
      font-size: 13.5px;
      line-height: 1.5;
      font-family: var(--mono);
    }

    .mistake-fix {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--accent-green);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .mistake-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .wrong-icon {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
    }

    .fix-icon {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    /* Quizzes */
    .quiz-q {
      margin-bottom: 22px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .quiz-q:last-child {
      margin-bottom: 12px;
    }

    .quiz-q p.qtext {
      color: var(--fg);
      font-weight: 700;
      margin-bottom: 14px;
      font-size: 15px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .quiz-q-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 800;
      color: var(--fg-dim);
      flex-shrink: 0;
    }

    .quiz-opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quiz-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-dim);
      font-size: 14px;
      color: var(--fg);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .quiz-opt:hover {
      border-color: var(--primary);
      background: var(--surface-hover);
    }

    .quiz-opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      color: var(--fg-dim);
      flex-shrink: 0;
    }

    .quiz-opt.correct {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
      font-weight: 700;
    }

    .quiz-opt.correct .quiz-opt-letter {
      background: var(--accent-green);
      color: #FFFFFF;
      border-color: var(--accent-green);
    }

    .quiz-opt.wrong {
      background: rgba(244, 63, 94, 0.15);
      border-color: var(--accent-rose);
      color: var(--accent-rose);
      font-weight: 700;
    }

    .quiz-opt.wrong .quiz-opt-letter {
      background: var(--accent-rose);
      color: #FFFFFF;
      border-color: var(--accent-rose);
    }

    .quiz-opt:disabled {
      cursor: default;
    }

    /* Challenge Box */
    .challenge-box {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid var(--accent-purple);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 15px;
      line-height: 1.65;
      color: var(--fg);
    }

    :root[data-theme="light"] .challenge-box {
      background: #F5F3FF;
      border-color: #DDD6FE;
      border-left-color: #8B5CF6;
    }

    .challenge-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(139, 92, 246, 0.15);
      font-size: 22px;
      flex-shrink: 0;
    }

    .challenge-box p {
      margin: 0;
      align-self: center;
    }

    /* What comes next box */
    .next-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }

    .next-box p {
      margin: 0;
      font-size: 15px;
      color: var(--fg-dim);
      line-height: 1.6;
    }

    .next-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-success {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF !important;
      border: none;
      font-weight: 700;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.45);
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 13px 24px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============ CODE PLAYGROUND ============ */
    .editor-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 18px 0;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .editor-tabs {
      display: flex;
      background: var(--surface-dim);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .etab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: var(--fg-dim);
      background: none;
      border: none;
      border-right: 1px solid var(--border);
      font-family: var(--mono);
    }

    .etab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .editor-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      padding: 6px 12px;
    }

    .editor-panes {
      display: flex;
      min-height: 280px;
    }

    .editor-pane {
      flex: 1;
      min-width: 0;
    }

    .editor-pane textarea {
      width: 100%;
      height: 280px;
      border: none;
      resize: vertical;
      padding: 16px;
      font-family: var(--mono);
      font-size: 13px;
      background: var(--surface);
      color: var(--fg);
      line-height: 1.6;
    }

    .editor-preview {
      flex: 1;
      min-width: 0;
      border-left: 1px solid var(--border);
      background: #FFFFFF;
    }

    .editor-preview iframe {
      width: 100%;
      height: 280px;
      border: none;
      display: block;
    }

    @media (max-width: 760px) {
      .editor-panes {
        flex-direction: column;
      }

      .editor-preview {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    .hint-block {
      background: var(--surface-dim);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .hint-block b {
      font-family: var(--head);
      font-size: 13px;
      color: var(--primary);
    }

    /* Projects */
    .proj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .proj-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .proj-bar {
      height: 4px;
      width: 100%;
    }

    .proj-body {
      padding: 18px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .proj-body h3 {
      font-size: 16.5px;
      margin-bottom: 6px;
    }

    .proj-body .pd {
      font-size: 13.5px;
      color: var(--fg-dim);
      flex: 1;
      margin-bottom: 14px;
    }

    .proj-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .skill-chip {
      font-size: 11px;
      background: var(--surface-dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--fg-dim);
      margin-right: 4px;
      font-weight: 600;
    }

    /* Badges */
    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .badge .b-emoji {
      font-size: 34px;
      margin-bottom: 10px;
      filter: grayscale(1);
      opacity: .3;
    }

    .badge.unlocked .b-emoji {
      filter: none;
      opacity: 1;
    }

    .badge h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .badge p {
      font-size: 12px;
      margin: 0;
    }

    /* Glossary */
    .gloss-item {
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
    }

    .gloss-item:first-child {
      padding-top: 0;
    }

    .gloss-term {
      font-family: var(--head);
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--fg);
    }

    .gloss-related {
      margin-top: 10px;
    }

    .gloss-related span {
      font-size: 11.5px;
      color: var(--primary);
      background: rgba(245, 158, 11, 0.12);
      padding: 3px 9px;
      border-radius: 999px;
      margin-right: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ============ RESPONSIVE MEDIA QUERIES (TABLETS & PHONES) ============ */
    .lesson-toc-details>summary {
      list-style: none;
      cursor: default;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lesson-toc-details>summary::-webkit-details-marker {
      display: none;
    }

    .toc-toggle-badge {
      display: none;
    }

    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        max-width: 84vw;
        height: 100%;
        height: 100dvh;
        z-index: 50;
        transform: translateX(-100%);
        box-shadow: none;
        transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 35px rgba(0, 0, 0, 0.55);
      }

      .sidebar-close-btn {
        display: flex;
      }

      .hamburger {
        display: inline-flex;
      }

      .side-progress {
        margin-bottom: 80px;
      }

      .topbar {
        padding: 10px 14px;
        gap: 10px;
      }

      .search-wrap {
        flex: 1;
        min-width: 0;
        max-width: none;
      }

      .search-input {
        padding: 8px 12px 8px 34px;
        font-size: 13px;
      }

      .search-icon {
        left: 11px;
        font-size: 13px;
      }

      .topbar-spacer {
        display: none;
      }

      .mode-switcher {
        flex-shrink: 0;
      }

      .content {
        padding: 20px 16px 60px;
      }

      .hero-banner {
        padding: 26px 20px;
        border-radius: 20px;
        margin-bottom: 24px;
      }

      .hero-title {
        font-size: 30px;
      }

      .hero-actions {
        gap: 10px;
        margin-bottom: 22px;
      }

      .hero-stats-row {
        gap: 16px;
        padding-top: 16px;
      }

      .lesson-layout {
        flex-direction: column;
      }

      .lesson-toc {
        width: 100%;
        flex: none;
        position: static;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 22px;
      }

      .lesson-toc-details>summary {
        cursor: pointer;
      }

      .toc-toggle-badge {
        display: inline-block;
        font-size: 11px;
        background: rgba(245, 158, 11, 0.15);
        color: var(--primary);
        padding: 3px 8px;
        border-radius: 999px;
        font-weight: 700;
      }

      .toc-items-list {
        margin-top: 10px;
        max-height: 240px;
        overflow-y: auto;
      }
    }

    @media (max-width: 640px) {
      .content {

  <script>
    /* =========================================================================
       FOUNDRY — a beginner web-development learning platform

         1. CONTENT DATA  (levels, lessons, projects, glossary, achievements)

         3. ROUTER + RENDER (page components)
         4. CODE PLAYGROUND (live HTML/CSS/JS preview)
       ========================================================================= */

    /* ---------------------------------------------------------------------
       1. CONTENT DATA
    --------------------------------------------------------------------- */

    const GLOSSARY = [
      { term: "HTML", simple: "The language you use to write the content and structure of a web page — headings, paragraphs, images, links.", tech: "HyperText Markup Language: a markup language that defines the structure of a document using nested elements.", example: "<h1>Hello</h1>", related: ["CSS", "DOM", "Semantic HTML"] },
      { term: "CSS", simple: "The language that styles your HTML — colors, spacing, layout, fonts.", tech: "Cascading Style Sheets: a stylesheet language used to describe the presentation of a document written in HTML.", example: "h1 { color: blue; }", related: ["HTML", "Selector", "Box Model"] },
      { term: "JavaScript", simple: "The language that makes web pages interactive — it can react to clicks, change content, and talk to servers.", tech: "A high-level, dynamically-typed scripting language that runs in the browser (and elsewhere) to add behavior to web pages.", example: "alert('Hi!');", related: ["DOM", "Function", "Variable"] },
      { term: "Variable", simple: "A labeled box where you store a value so you can use it later.", tech: "A named reference to a value stored in memory, declared with let, const, or var in JavaScript.", example: "let age = 25;", related: ["JavaScript", "Data type"] },
      { term: "Function", simple: "A reusable block of instructions you can run whenever you need it, like a recipe.", tech: "A block of code designed to perform a particular task, defined once and invoked (called) as needed.", example: "function greet(){ return 'hi'; }", related: ["Parameter", "Return"] },
      { term: "Array", simple: "A single list that holds multiple values in order, like a numbered shelf.", tech: "An ordered, zero-indexed collection of values stored under a single variable name.", example: "let colors = ['red','green','blue'];", related: ["Object", "Loop", "forEach"] },
      { term: "Object", simple: "A way to group related information together using labels, like a filled-out form.", tech: "A collection of key–value pairs used to represent structured data in JavaScript.", example: "let user = { name:'Ada', age:30 };", related: ["Array", "JSON"] },
      { term: "DOM", simple: "The browser's way of representing your HTML page as something JavaScript can read and change.", tech: "Document Object Model: a tree-like, in-memory representation of the HTML document that scripts can query and manipulate.", example: "document.getElementById('title')", related: ["JavaScript", "HTML", "querySelector"] },
      { term: "API", simple: "A way for two pieces of software to talk to each other — like a waiter taking your order to the kitchen.", tech: "Application Programming Interface: a defined set of rules that lets one program request data or services from another.", example: "fetch('https://api.example.com/users')", related: ["HTTP", "JSON", "fetch"] },
      { term: "HTTP", simple: "The set of rules browsers and servers use to send requests and responses to each other.", tech: "HyperText Transfer Protocol: the application-layer protocol used for transmitting web resources between clients and servers.", example: "GET /index.html HTTP/1.1", related: ["API", "Server", "Status code"] },
      { term: "JSON", simple: "A simple text format for sending structured data, built out of objects and arrays.", tech: "JavaScript Object Notation: a lightweight, language-independent data-interchange format based on JS object syntax.", example: '{"name":"Ada","age":30}', related: ["API", "Object", "fetch"] },
      { term: "Server", simple: "A computer somewhere else that stores your website and sends it to visitors when asked.", tech: "A program (and the machine running it) that listens for requests and returns responses, often over HTTP.", example: "A machine running Node.js on port 3000", related: ["Backend", "Hosting", "API"] },
      { term: "Database", simple: "An organized place to permanently store data so it isn't lost when the server restarts.", tech: "A structured system for storing, managing, and querying persistent data, often organized into tables.", example: "A users table with columns id, name, email", related: ["SQL", "Table", "Backend"] },
      { term: "SQL", simple: "A language for asking a database questions and telling it what to store, change, or delete.", tech: "Structured Query Language: the standard language for defining and manipulating relational databases.", example: "SELECT * FROM users WHERE age > 18;", related: ["Database", "Table"] },
      { term: "Git", simple: "A tool that saves snapshots of your code over time, so you can undo mistakes and track changes.", tech: "A distributed version-control system for tracking changes in source code during software development.", example: "git commit -m \"add login page\"", related: ["Repository", "GitHub"] },
      { term: "Repository", simple: "A project folder that Git is keeping a history of.", tech: "A storage location (often called a 'repo') containing a project's files and its full version history.", example: "github.com/you/my-portfolio", related: ["Git", "GitHub"] },
      { term: "Framework", simple: "A pre-built toolkit that gives you structure and shortcuts so you don't build everything from zero.", tech: "A reusable set of libraries, conventions, and tools that provides a foundation for building applications.", example: "React, Vue, Express", related: ["Library"] },
      { term: "Library", simple: "A collection of ready-made code you can borrow instead of writing it yourself.", tech: "A collection of pre-written functions/modules that a program can call, without dictating the app's structure.", example: "Using Chart.js to draw a graph", related: ["Framework"] },
      { term: "Frontend", simple: "Everything a visitor actually sees and clicks on in their browser.", tech: "The client-side portion of an application: the UI layer built with HTML, CSS, and JavaScript that runs in the browser.", example: "The layout, colors, and buttons of a site", related: ["Backend", "HTML", "CSS"] },
      { term: "Backend", simple: "The behind-the-scenes part of an app that handles data, logic, and security on a server.", tech: "The server-side portion of an application responsible for business logic, data storage, and APIs.", example: "Code that checks a password and saves an order", related: ["Frontend", "Server", "Database"] },
      { term: "Full-stack", simple: "Knowing and building both the frontend and the backend of an application.", tech: "Describes a developer or application that spans both client-side and server-side development.", example: "A to-do app with a React UI and a Node.js API", related: ["Frontend", "Backend"] },
      { term: "Authentication", simple: "Proving who you are, usually with a username and password.", tech: "The process of verifying the identity of a user or system.", example: "Logging in with an email and password", related: ["Authorization", "Server"] },

      { term: "Event loop", simple: "The behind-the-scenes coordinator in Node.js that handles many tasks without freezing your program.", tech: "The mechanism that allows Node.js to perform non-blocking I/O operations by offloading tasks to the OS kernel whenever possible.", example: "setTimeout(() => console.log('ding'), 1000);", related: ["Node.js", "Asynchronous", "Promise"] },
      { term: "npm", simple: "The world's biggest store of ready-made JavaScript code you can install and use in your projects.", tech: "Node Package Manager: the default package manager and online registry for the JavaScript runtime environment Node.js.", example: "npm install express", related: ["Node.js", "package.json", "Library"] },
      { term: "Express", simple: "A popular toolkit for Node.js that makes building websites and APIs much faster and cleaner.", tech: "A fast, unopinionated, minimalist web framework for Node.js used to build web applications and RESTful APIs.", example: "app.get('/api/users', (req, res) => res.json(users));", related: ["Node.js", "API", "REST", "Server"] },
      { term: "React Native", simple: "A framework that lets you build real mobile apps for iPhones and Android phones using JavaScript and React.", tech: "An open-source UI software framework created by Meta used to develop applications for Android, iOS, and the web by enabling developers to use React with native platform capabilities.", example: "<View><Text>Hello Mobile!</Text></View>", related: ["React", "View", "StyleSheet", "Mobile"] },

      { term: "FlatList", simple: "A high-speed list for mobile phones that only displays the items currently visible on the screen, saving memory.", tech: "A core component in React Native that renders performant, scrollable lists with memory virtualization, lazy loading, and view recycling.", example: "<FlatList data={items} renderItem={({ item }) => <Text>{item.name}</Text>} />", related: ["React Native", "ScrollView", "Performance"] },

      L("node-express-rest-api", "REST APIs with Express: Routing & Middleware", {

        syntaxLabel: "Express REST Syntax",
        syntax: "const express = require('express');\\nconst app = express();\\n\\n// Middleware to parse incoming JSON payloads\\napp.use(express.json());\\n\\n// Route handler\\napp.get('/api/users/:id', (req, res) => {\\n  const userId = req.params.id;\\n  res.json({ id: userId, name: 'Senior Developer' });\\n});\\n\\napp.listen(3000);",
        example: "const express = require('express');\\nconst app = express();\\napp.use(express.json());\\n\\n// In-memory data store\\nlet tasks = [\\n  { id: 1, title: 'Master Node.js Event Loop', done: true },\\n  { id: 2, title: 'Build Express REST API', done: false }\\n];\\n\\n// GET all tasks\\napp.get('/api/tasks', (req, res) => {\\n  res.json({ count: tasks.length, data: tasks });\\n});\\n\\n// POST a new task\\napp.post('/api/tasks', (req, res) => {\\n  const { title } = req.body;\\n  if (!title) return res.status(400).json({ error: 'Title required' });\\n  const newTask = { id: tasks.length + 1, title, done: false };\\n  tasks.push(newTask);\\n  res.status(201).json(newTask);\\n});\\n\\napp.listen(3000);",

      L("node-crud-json-storage", "Full CRUD REST API with Error Handling & Data Persistence", {
        goal: "Implement a complete Create, Read, Update, Delete (CRUD) backend API with HTTP status codes, structured validation, and centralized error handling.",
        simple: "CRUD represents the four fundamental operations of any database-backed system: Create (POST), Read (GET), Update (PUT/PATCH), and Delete (DELETE). A production-ready API maps each operation to standard REST conventions.",
        analogy: "Think of CRUD like managing records in a doctor's medical office: registering a new patient chart (Create / POST), looking up their medical chart (Read / GET), updating their medication dosage (Update / PUT), and archiving or discharging an expired record (Delete / DELETE). Each operation requires verifying identity and following standard medical protocols (status codes and validation).",
        syntaxLabel: "RESTful CRUD Convention Mapping",
        syntax: "// REST Architecture Standards:\\n// POST   /api/items       -> 201 Created (Create)\\n// GET    /api/items       -> 200 OK (Read collection)\\n// GET    /api/items/:id   -> 200 OK or 404 Not Found (Read item)\\n// PUT    /api/items/:id   -> 200 OK or 404 Not Found (Update)\\n// DELETE /api/items/:id   -> 200 OK or 204 No Content (Delete)",
        example: "const express = require('express');\\nconst app = express();\\napp.use(express.json());\\n\\nlet inventory = [\\n  { id: 101, name: 'Mechanical Keyboard', qty: 25 },\\n  { id: 102, name: '4K Monitor', qty: 14 }\\n];\\n\\n// UPDATE\\napp.put('/api/inventory/:id', (req, res) => {\\n  const id = Number(req.params.id);\\n  const item = inventory.find(i => i.id === id);\\n  if (!item) return res.status(404).json({ error: 'Item not found' });\\n  item.qty = req.body.qty ?? item.qty;\\n  res.json({ message: 'Updated', item });\\n});\\n\\n// DELETE\\napp.delete('/api/inventory/:id', (req, res) => {\\n  const id = Number(req.params.id);\\n  const initialLength = inventory.length;\\n  inventory = inventory.filter(i => i.id !== id);\\n  if (inventory.length === initialLength) return res.status(404).json({ error: 'Item not found' });\\n  res.json({ message: 'Deleted successfully' });\\n});\\n\\napp.listen(3000);",
        exampleNote: "Production PUT and DELETE implementation with defensive validation and 404 handling",
        lines: [
          ["Number(req.params.id)", "Always cast route parameters from strings to numbers when matching numerical IDs."],
          ["if (!item) return res.status(404)...", "Returns an early HTTP 404 Not Found response if the target resource does not exist."],
          ["app.delete('/api/inventory/:id', ...)", "Binds the HTTP DELETE verb to remove the item from the persistent collection."]
        ],
        tryIt: "Test full CRUD operations in the sandbox: retrieve items, create a new record, and verify update responses.",
        mistakes: [
          ["Returning HTTP 200 OK when a resource is not found.", "Client applications rely on HTTP status codes to detect errors. Always return 404 Not Found so frontend apps and mobile clients can handle missing resources correctly."],
          ["Mutating req.params directly instead of reading it.", "req.params is an input descriptor provided by Express routing; treat it as read-only."]
        ],
        quiz: [
          { q: "Which HTTP verb is conventionally used to update an existing resource completely?", opts: ["POST", "PUT", "FETCH", "UPDATE"], a: 1 },
          { q: "What status code should an API return when a client sends invalid or missing required data?", opts: ["500 Internal Server Error", "400 Bad Request", "401 Unauthorized", "404 Not Found"], a: 1 },
          { q: "What does the 'D' in CRUD stand for?", opts: ["Document", "Delete", "Deploy", "Debug"], a: 1 }
        ],
        challenge: "Build a DELETE endpoint that checks if an item has qty > 0 before deleting, returning a 400 Bad Request if stock still remains.",
        next: "Congratulations! You have completed Level 6: Node.js & Backend Architecture. Now apply your skills in Project: Building a complete RESTful catalog API!",
        playground: {
          mode: "node",
          js: "const express = require('express');\\nconst app = express();\\napp.use(express.json());\\n\\nlet catalog = [\\n  { id: 1, title: 'Ergonomic Desk Chair', price: 299 },\\n  { id: 2, title: 'USB-C Dual Dock', price: 149 }\\n];\\n\\n// 1. READ ALL (GET)\\napp.get('/api/catalog', (req, res) => {\\n  res.json({ total: catalog.length, items: catalog });\\n});\\n\\n// 2. CREATE (POST)\\napp.post('/api/catalog', (req, res) => {\\n  const { title, price } = req.body;\\n  if (!title || price === undefined) {\\n    return res.status(400).json({ error: 'Title and price are required' });\\n  }\\n  const newItem = { id: catalog.length + 1, title, price: Number(price) };\\n  catalog.push(newItem);\\n  res.status(201).json(newItem);\\n});\\n\\n// 3. DELETE (DELETE)\\napp.delete('/api/catalog/:id', (req, res) => {\\n  const id = Number(req.params.id);\\n  const idx = catalog.findIndex(i => i.id === id);\\n  if (idx === -1) return res.status(404).json({ error: 'Item not found' });\\n  const removed = catalog.splice(idx, 1)[0];\\n  res.json({ message: 'Item removed', removed });\\n});\\n\\napp.listen(3000, () => {\\n  console.log('📦 Full CRUD Catalog API running on port 3000');\\n});",
          css: "",
          html: ""
        }
      })
    ];
